#
# Template new-tool.sh renders (substituting __TOOL_ALIAS__). Same shape as
# static/kb/modaas-docs-mcp.yaml and static/reference-impl/demo-tool-backend.yaml:
# a ConfigMap carrying server.py, a Deployment that mounts and runs it, and a
# ClusterIP Service the ToolConfig's baseUrl points at. No image build: the
# server is stdlib-only Python run against the public Docker base image, so
# nothing here needs CodeBuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: __TOOL_ALIAS__-mcp-app
  namespace: components
  labels:
    app.kubernetes.io/name: __TOOL_ALIAS__-mcp
    app.kubernetes.io/part-of: modaas-workshop
binaryData: {}   # new-tool.sh fills this in with server.py, base64-encoded
---
apiVersion: v1
kind: Service
metadata:
  name: __TOOL_ALIAS__-mcp
  namespace: components
  labels:
    app.kubernetes.io/name: __TOOL_ALIAS__-mcp
    app.kubernetes.io/part-of: modaas-workshop
spec:
  selector:
    app.kubernetes.io/name: __TOOL_ALIAS__-mcp
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __TOOL_ALIAS__-mcp
  namespace: components
  labels:
    app.kubernetes.io/name: __TOOL_ALIAS__-mcp
    app.kubernetes.io/part-of: modaas-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __TOOL_ALIAS__-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __TOOL_ALIAS__-mcp
    spec:
      containers:
      - name: server
        # Same base image the other in-cluster MCP backends use. The image
        # pull is the kubelet's, not the pod's, so the components egress
        # NetworkPolicy does not govern it; the pod's own egress once
        # running is nil, which is what keeps a tool like this from ever
        # becoming a spend source.
        image: public.ecr.aws/docker/library/python:3.12-slim
        command: ["python3", "/app/server.py"]
        ports:
        - containerPort: 8080
        env:
        - name: TOOL_NAME
          value: "__TOOL_ALIAS__"
        - name: PYTHONUNBUFFERED
          value: "1"
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - {mountPath: /app, name: app}
      volumes:
      - name: app
        configMap:
          name: __TOOL_ALIAS__-mcp-app
