apiVersion: oda.tmforum.org/v1beta1
kind: ToolConfig
metadata:
  name: customer-records
  namespace: components
  annotations:
    # Platform-declared at install: approve in the same apply so the CR never
    # enters Reviewing. Annotating after apply raced the creation reconcile
    # (E4 2026-10-03: 2/8 tools parked, Provisioned never surfaced).
    modaas.tmforum.org/approver: system-admin
    modaas.tmforum.org/approval-attestation: Approved by the workshop platform at install
spec:
  toolName: customer-records
  provider: agentCoreGateway
  description: "Look up customers impacted by a fault at a given site"
  agentCoreGateway:
    gatewayIdentifier: "${MODAAS_GATEWAY_ID}"
    # The Gateway invokes the Lambda with its own service role (GATEWAY_IAM_ROLE);
    # the Lambda ARN is the target. Both substituted by bootstrap step 14.
    credentialProviderType: GATEWAY_IAM_ROLE
    mcpServer:
      endpoint: "arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:team-${TEAM}-customer-records"
    tools:
      - name: customer_lookup
        description: "Return customers at a site with their tier, services, and open complaints"
        inputSchema:
          type: object
          properties:
            site:
              type: string
              description: "Site identifier, e.g. SITE-DEN-12"
          required: [site]
  governance:
    approval: {required: true, requiredApprovals: 1}
  access:
    # Canonical shape (same as the other shipped tools): permit unless the
    # request names a tool outside the allowlist. MCP initialize/tools/list
    # carry no toolName and must pass; a `when { context has toolName ... }`
    # form denies the handshake itself (E7 2026-10-04: every call 403 at
    # initialize). Tool names carry the Gateway target prefix <alias>___<tool>
    # (event 486b9241: bare names never match).
    cedarPolicy: |
      permit(
        principal,
        action == Action::"invoke",
        resource
      ) unless {
        context has toolName && !["customer-records___customer_lookup"].contains(context.toolName)
      } unless {
        resource has dataClassification && resource.dataClassification == "restricted"
      };
