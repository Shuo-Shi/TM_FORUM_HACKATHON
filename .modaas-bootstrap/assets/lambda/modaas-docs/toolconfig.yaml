# NAME: helper-docs, not modaas-docs. Participants declare `modaas-docs`
# themselves in the platform-access module (an in-cluster backend they deploy,
# review and approve by hand — that lifecycle is the lesson). The helper's
# documentation search is this Lambda, declared by the platform at install
# under its own name so the two never collide.
apiVersion: oda.tmforum.org/v1beta1
kind: ToolConfig
metadata:
  name: helper-docs
  namespace: components
  annotations:
    # Platform-declared at install: approve in the same apply so the CR never
    # enters Reviewing. Annotating after apply raced the creation reconcile
    # (E4 2026-10-03: 2/8 tools parked, Provisioned never surfaced).
    modaas.tmforum.org/approver: system-admin
    modaas.tmforum.org/approval-attestation: Approved by the workshop platform at install
spec:
  toolName: helper-docs
  provider: agentCoreGateway
  toolType: mcp
  description: "ODA Canvas + MoDaaS documentation search -- public docs corpus, read-only"
  agentCoreGateway:
    gatewayIdentifier: "${MODAAS_GATEWAY_ID}"
    # The Gateway invokes the Lambda with its own service role (GATEWAY_IAM_ROLE);
    # the Lambda ARN is the target. Both substituted by bootstrap step 14.
    credentialProviderType: GATEWAY_IAM_ROLE
    mcpServer:
      endpoint: "arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:team-${TEAM}-modaas-docs"
    tools:
    - name: search_docs
      description: >-
        Search the ODA Canvas and MoDaaS documentation corpus. Returns ranked
        passages with source_path and heading_path for citation.
      inputSchema:
        type: object
        properties:
          query:
            type: string
            description: "What you want to know."
          limit:
            type: integer
            description: "Passages to return, 1-20 (default 5)."
          source:
            type: string
            description: "Restrict to one corpus: ai-canvas, modaas, oda-canvas, or workshop."
        required: ["query"]
  governance:
    approval: {required: true, requiredApprovals: 1}
    dataClassification: public
    owner: "workshop-facilitators"
  access:
    # Tool names seen by Cedar carry the Gateway target prefix (<alias>___<tool>):
    # a bare name never matches and every tools/call is DENIED (event 486b9241).
    cedarPolicy: |
      permit(
        principal,
        action == Action::"invoke",
        resource
      ) unless {
        context has toolName &&
        !["helper-docs___search_docs", "get_doc"].contains(context.toolName)
      } unless {
        resource has dataClassification &&
        resource.dataClassification == "restricted"
      };
