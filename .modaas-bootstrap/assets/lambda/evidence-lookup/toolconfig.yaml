apiVersion: oda.tmforum.org/v1beta1
kind: ToolConfig
metadata:
  name: evidence-lookup
  namespace: components
  annotations:
    # Platform-declared at install: approve in the same apply so the CR never
    # enters Reviewing. Annotating after apply raced the creation reconcile
    # (E4 2026-10-03: 2/8 tools parked, Provisioned never surfaced).
    modaas.tmforum.org/approver: system-admin
    modaas.tmforum.org/approval-attestation: Approved by the workshop platform at install
spec:
  toolName: evidence-lookup
  provider: agentCoreGateway
  toolType: mcp
  description: "Read-only evidence retrieval: ledger timeline and gateway logs for a correlation ID"
  agentCoreGateway:
    gatewayIdentifier: "${MODAAS_GATEWAY_ID}"
    # The Gateway invokes the Lambda with its own service role (GATEWAY_IAM_ROLE);
    # the Lambda ARN is the target. Both substituted by bootstrap step 14.
    credentialProviderType: GATEWAY_IAM_ROLE
    mcpServer:
      endpoint: "arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:team-${TEAM}-evidence-lookup"
    tools:
    - name: get_evidence
      description: >-
        Look up evidence for a given correlation ID. Returns the ledger
        timeline from audit-store and gateway log lines from CloudWatch.
      inputSchema:
        type: object
        properties:
          correlation_id:
            type: string
            description: "Correlation ID of the agent run to look up."
          run_id:
            type: string
            description: "Optional run ID to narrow the gateway log search."
        required: ["correlation_id"]
  governance:
    approval: {required: true, requiredApprovals: 1}
    dataClassification: internal
    owner: "workshop-facilitators"
  access:
    # Tool names seen by Cedar carry the Gateway target prefix (<alias>___<tool>):
    # a bare name never matches and every tools/call is DENIED (event 486b9241).
    cedarPolicy: |
      permit(
        principal,
        action == Action::"invoke",
        resource
      ) unless {
        context has toolName &&
        !["evidence-lookup___get_evidence"].contains(context.toolName)
      } unless {
        resource has dataClassification &&
        resource.dataClassification == "restricted"
      };
