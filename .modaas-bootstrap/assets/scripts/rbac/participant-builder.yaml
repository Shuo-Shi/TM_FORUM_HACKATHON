apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modaas-participant-builder
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  - storage.k8s.io
  - scheduling.k8s.io
  - node.k8s.io
  - apiregistration.k8s.io
  - networking.k8s.io
  resources:
  - nodes
  - persistentvolumes
  - storageclasses
  - priorityclasses
  - runtimeclasses
  - apiservices
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oda.tmforum.org
  - agentgateway.dev
  - gateway.networking.k8s.io
  - networking.istio.io
  - security.istio.io
  - cert-manager.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.aws
  - networking.k8s.io
  - policy
  - discovery.k8s.io
  - metrics.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modaas-participant-builder
subjects:
- kind: Group
  name: modaas:participants
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: modaas-participant-builder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modaas-crs-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: 'true'
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
- apiGroups:
  - oda.tmforum.org
  - agentgateway.dev
  - gateway.networking.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modaas-participant-admin
subjects:
- kind: Group
  name: modaas:participants
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
