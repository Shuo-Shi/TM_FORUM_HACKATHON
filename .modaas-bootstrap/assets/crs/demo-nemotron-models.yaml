# D-01 demo: NVIDIA Nemotron on Bedrock serverless, governed by MoDaaS.
# Verified 2026-09-03: nvidia.nemotron-* are native ON_DEMAND Bedrock FMs
# in us-east-1/us-west-2 (aws bedrock list-foundation-models).
# "Nemotron-only estate" = these ModelConfigs + the admission allow-list.
#
# Third model added 2026-09-24: nemotron-nano-3-30b, the
# mid-tier text model between the 9B and the 120B. Verified live on Bedrock
# (docs.aws.amazon.com/bedrock/latest/userguide/model-card-nvidia-nemotron-nano-3-30b.html):
# nvidia.nemotron-nano-3-30b, 256K context, us-east-1 in-region. Left in
# Reviewing like nemotron-super-120b -- a third un-attested CR strengthens the
# baseline walkthrough's "approval is per-asset, not per-batch" evidence.
apiVersion: oda.tmforum.org/v1beta1
kind: ModelConfig
metadata:
  name: nemotron-nano-9b
  namespace: components
spec:
  alias: nemotron-nano-9b
  provider: aws-bedrock
  modelId: nvidia.nemotron-nano-9b-v2
  credentialProviderType: NONE
  paused: false
  awsBedrock:
    apiMode: converse
    region: us-east-1
    guardrails:
      contentPolicy:
        filters:
        - inputStrength: HIGH
          outputStrength: NONE
          type: PROMPT_ATTACK
  # Who may invoke this model, stated by the model owner. The
  # identity hook consults the Cedar permits projected from this list; a model
  # with none serves nobody. "bootstrap-key" is the event's shared API-key tier
  # ServiceIdentity bootstrap-key). Add an agent's IdentityConfig
  # client id here to grant that agent by its own identity instead.
  access:
    allowedConsumers: ["bootstrap-key"]
  governance:
    approval:
      required: true
      requiredApprovals: 1
  safety:
    required: true
    enforcer:
      kind: bedrockGuardrail
      enforcedAt: self
