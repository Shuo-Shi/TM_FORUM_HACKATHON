#
# aws-knowledge ToolConfig -- AWS Knowledge MCP server as a Gateway MCP target.
#
# Endpoint: https://knowledge-mcp.global.api.aws (public, Streamable HTTP,
# no auth required). Confirmed from docs.aws.amazon.com AgentCore Gateway
# MCP servers page and awslabs/mcp repository.
#
# This ToolConfig registers the AWS Knowledge MCP server as a remote MCP
# target on the AgentCore Gateway, so agents can query AWS documentation
# through the governed gateway path.
apiVersion: oda.tmforum.org/v1beta1
kind: ToolConfig
metadata:
  name: aws-knowledge
  namespace: components
  annotations:
    # Platform-declared at install: approve in the same apply so the CR never
    # enters Reviewing. Annotating after apply raced the creation reconcile
    # (E4 2026-10-03: 2/8 tools parked, Provisioned never surfaced).
    modaas.tmforum.org/approver: system-admin
    modaas.tmforum.org/approval-attestation: Approved by the workshop platform at install
spec:
  toolName: aws-knowledge
  provider: agentCoreGateway
  toolType: mcp
  description: "AWS Knowledge MCP server -- search AWS documentation and best practices"
  agentCoreGateway:
    gatewayIdentifier: "${MODAAS_GATEWAY_ID}"
    credentialProviderType: NONE
    mcpServer:
      endpoint: "https://knowledge-mcp.global.api.aws"
      transport: streamable-http
  governance:
    approval: {required: true, requiredApprovals: 1}
    dataClassification: public
    owner: "workshop-facilitators"
  access:
    # Canonical shape (same as the other shipped tools): permit unless the
    # request names a tool outside the allowlist. MCP initialize/tools/list
    # carry no toolName and must pass; a `when { context has toolName ... }`
    # form denies the handshake itself (E7 2026-10-04: every call 403 at
    # initialize). Tool names carry the Gateway target prefix <alias>___<tool>.
    cedarPolicy: |
      permit(
        principal,
        action == Action::"invoke",
        resource
      ) unless {
        context has toolName && ![
          "aws-knowledge___aws___read_documentation",
          "aws-knowledge___aws___search_documentation",
          "aws-knowledge___aws___list_regions",
          "aws-knowledge___aws___get_regional_availability",
          "aws-knowledge___aws___retrieve_skill"
        ].contains(context.toolName)
      } unless {
        resource has dataClassification && resource.dataClassification == "restricted"
      };
