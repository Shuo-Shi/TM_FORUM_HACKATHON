apiVersion: oda.tmforum.org/v1beta1
kind: ModelConfig
metadata:
  name: nemotron-super-120b-helper
  namespace: components
  annotations:
    # Platform-declared at install: approve in the same apply so the CR never
    # enters Reviewing. Annotating after apply raced the creation reconcile
    # (E4 2026-10-03: 2/8 tools parked, Provisioned never surfaced).
    modaas.tmforum.org/approver: system-admin
    modaas.tmforum.org/approval-attestation: Approved by the workshop platform at install
spec:
  alias: nemotron-super-120b-helper
  provider: aws-bedrock
  modelId: nvidia.nemotron-super-3-120b
  credentialProviderType: NONE
  paused: false
  awsBedrock:
    apiMode: converse
    # Bedrock-native defaults the gateway honors for this alias.
    inferenceConfig:
      maxTokens: 800
    region: "${REGION}"
    guardrails:
      contentPolicy:
        filters:
        - inputStrength: HIGH
          outputStrength: NONE
          type: PROMPT_ATTACK
      # Bedrock takes a fixed list of PII entity types (there is no ALL).
      # These are the ones a participant is likely to paste by accident.
      piiPolicy:
        entities:
        - {type: NAME, action: ANONYMIZE}
        - {type: EMAIL, action: ANONYMIZE}
        - {type: PHONE, action: ANONYMIZE}
        - {type: ADDRESS, action: ANONYMIZE}
        - {type: USERNAME, action: ANONYMIZE}
        - {type: PASSWORD, action: BLOCK}
        - {type: AWS_ACCESS_KEY, action: BLOCK}
        - {type: AWS_SECRET_KEY, action: BLOCK}
        - {type: CREDIT_DEBIT_CARD_NUMBER, action: BLOCK}
        - {type: IP_ADDRESS, action: ANONYMIZE}
  access:
    allowedConsumers: ["bootstrap-key"]
  governance:
    approval:
      required: true
      requiredApprovals: 1
    dataClassification: internal
  safety:
    required: true
    enforcer:
      kind: bedrockGuardrail
      enforcedAt: self
