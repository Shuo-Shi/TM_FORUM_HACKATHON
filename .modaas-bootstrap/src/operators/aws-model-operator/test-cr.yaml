apiVersion: oda.tmforum.org/v1beta1
kind: ModelConfig
metadata:
  name: claude-sonnet-smoke
  namespace: components
spec:
  alias: claude-sonnet-smoke
  provider: aws-bedrock
  modelId: anthropic.claude-sonnet-4-5-20250929-v1:0
  description: Smoke test for Bedrock model operator
  capabilities:
    features: [chat, vision, tool-use, structured-output]
    tier: premium
    regions: [us-west-2]
  safety:
    required: true
  awsBedrock:
    region: us-west-2
    inferenceConfig:
      maxTokens: 4096
      temperature: 0.7
    guardrails:
      contentPolicy:
        filters:
          - { type: HATE,     inputStrength: HIGH, outputStrength: HIGH }
          - { type: VIOLENCE, inputStrength: HIGH, outputStrength: HIGH }
      blockedInputMessaging: "Input blocked by MoDaaS policy."
      blockedOutputsMessaging: "Output blocked by MoDaaS policy."
