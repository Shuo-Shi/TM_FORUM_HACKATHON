version: 0.2

env:
  variables:
    AWS_REGION: us-west-2
    ECR_REGISTRY: ""  # set at runtime: <account>.dkr.ecr.<region>.amazonaws.com (hardcoded dev account until 2026-09-23)
    IMAGE_NAME: modaas/modaas-operator

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - COMMIT_SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
  build:
    commands:
      - docker build -t $ECR_REGISTRY/$IMAGE_NAME:latest -t $ECR_REGISTRY/$IMAGE_NAME:$COMMIT_SHA .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/$IMAGE_NAME:latest
      - docker push $ECR_REGISTRY/$IMAGE_NAME:$COMMIT_SHA
      - echo "Pushed $ECR_REGISTRY/$IMAGE_NAME:$COMMIT_SHA"
