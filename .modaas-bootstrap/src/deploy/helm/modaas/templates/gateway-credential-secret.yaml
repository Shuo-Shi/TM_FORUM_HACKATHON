{{/*
a hardening note — perimeter credential for governed agents.

A redirected agent is told the perimeter URL by the operator (a design note) and, since
a hardening note promoted the a design note identity hook to BOTH agentgateway listeners, it must
also present a bearer credential or its own governance perimeter refuses it 403.

Why a second Secret rather than referencing agentgateway-system/agw-apikeys:
a Pod's secretKeyRef resolves only within the Pod's OWN namespace. Agents run in
the component namespace; the perimeter's key store lives in the agentgateway
namespace. Kubernetes offers no cross-namespace secret reference, so the key
must exist in the component namespace too.

This template is OFF by default (bootstrapKey empty), so a default install
creates no Secret. The operator still references the conventional name with
`optional: true` -- that is what lets a production install create the Secret out
of band (External Secrets, Canvas SecretsManagement) and set `create: false`.
When the Secret truly does not exist the env var is unset, the Pod starts, and
the agent is refused 403: the pre-a hardening note behaviour reached honestly, not a Pod
wedged in CreateContainerConfigError.

Set bootstrapKey for eval/workshop installs only.
*/}}
{{- if and .Values.gatewayCredential.create .Values.gatewayCredential.bootstrapKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gatewayCredential.secretName | quote }}
  namespace: {{ .Values.global.componentNamespace | quote }}
  labels:
    app.kubernetes.io/managed-by: modaas
    app.kubernetes.io/component: gateway-credential
  annotations:
    modaas.aws/purpose: >-
      Bearer credential agents present to the MoDaaS perimeter (a hardening note). Must
      match an entry in the perimeter key store (agentgateway-system/agw-apikeys).
type: Opaque
stringData:
  {{ .Values.gatewayCredential.secretKey }}: {{ .Values.gatewayCredential.bootstrapKey | quote }}
{{- end }}
