# RBAC for the AgentConfig kubernetesPod provider (a design note): the operator
# creates and manages Deployments/Services for governed agents, and the pods
# it renders run as the modaas-agent-default ServiceAccount.
#
# WHY THIS FILE EXISTS: none of this was ever chart-shipped. The reference
# cluster carried a hand-applied aws-agent-operator-kubernetespod ClusterRole
# and a hand-created components/modaas-agent-default SA, so every fresh
# install failed in sequence: AgentConfigs Failed with DeploymentReadFailed
# (operator forbidden on apps/deployments), then after RBAC the ReplicaSets
# failed with 'error looking up service account components/modaas-agent-default'.
# Proven in a Workshop Studio vended account, 2026-09-08.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "modaas.fullname" . }}-agent-operator-kubernetespod
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch","create","update","patch","delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "modaas.fullname" . }}-agent-operator-kubernetespod
subjects:
- kind: ServiceAccount
  name: aws-agent-operator
  namespace: {{ .Values.global.namespace | default "modaas-system" }}
roleRef:
  kind: ClusterRole
  name: {{ include "modaas.fullname" . }}-agent-operator-kubernetespod
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modaas-agent-default
  namespace: {{ .Values.global.componentNamespace | default "components" }}
