# AgentConfig — Open-contract CRD for ODA Canvas agent lifecycle
# =============================================================================
# Namespace-scoped CRD declaring one A2A-speaking agent's identity, agent card,
# runtime backing, dependencies, and access controls.
#
# Runtime providers: awsAgentCore (managed AgentCore Runtime) + kubernetesPod (dual-provider hosting).
# CEL rules enforce exactly-one typed block matching spec.provider, plus
# immutability of the identity pair {agentName, provider}.
#
# Extension protocol: add one typed sub-block + one CEL rule pair.
# =============================================================================
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentconfigs.oda.tmforum.org
  labels:
    app.kubernetes.io/part-of: modaas-canvas
  annotations:
    oda.tmforum.org/crd-version: "v1beta1"
    # Declarative spec lineage — ties this CRD to the TMF specification it
    # realizes, the way ODA Canvas CRDs cite TMF6xx / SID. MoDaaS is the first
    # concrete implementation of GB1085 §4 Canvas Operator Requirements.
    oda.tmforum.org/spec-sdo: "TMForum"
    oda.tmforum.org/specification: "GB1085 Model-as-a-Service v1.0.0"
    oda.tmforum.org/spec-section: "§1.3.1 Agent Developer enablement + §4 Canvas Operator Requirements"
    oda.tmforum.org/governed-asset: "agent"
spec:
  group: oda.tmforum.org
  scope: Namespaced
  names:
    plural: agentconfigs
    singular: agentconfig
    kind: AgentConfig
    shortNames: [ac]
    categories: [oda, modaas]
  conversion:
    strategy: None
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "Registers and governs one AI agent (an LLM-driven service that calls models and tools) and reconciles it into a runtime backend. An operator hosts the agent on AWS Bedrock AgentCore Runtime (an AWS managed service for running agents) or as an in-cluster Kubernetes Deployment+Service. Captures the agent's identity, its public capability descriptor (the 'agent card', used for A2A = Agent-to-Agent discovery), the models/tools it depends on (cross-asset gate), a safety attestation, and an approval+lifecycle state machine; publishes a TMF639 discovery record. Open contract: dual-provider [awsAgentCore, kubernetesPod] with an open provider pattern — any framework via a sibling operator, no CRD bump. Runs on ODA Canvas (TM Forum's open telco-platform framework); realizes GB1085 §1.3.1 Agent Developer enablement + §4 Canvas Operator Requirements."
          required: ["spec"]
          x-kubernetes-validations:
            # Governance approval gate invariants
            # Gate fires on EVERY serving phase: this kind's phase machine has a
            # distinct Active (deployed/serving) state past Approved — without it
            # in the trigger, a status writer could reach a serving state having
            # never satisfied the approval gate. (ModelConfig has no Active phase;
            # its gate correctly triggers on Approved alone.)
            - rule: |
                !has(self.status) || !has(self.status.phase)
                || !(self.status.phase in ['Approved', 'Active'])
                || !has(self.spec.governance) || !has(self.spec.governance.approval)
                || !has(self.spec.governance.approval.required)
                || self.spec.governance.approval.required != true
                || (has(self.status.governance) && has(self.status.governance.approvals)
                    && size(self.status.governance.approvals) >=
                       (has(self.spec.governance.approval.requiredApprovals) ? self.spec.governance.approval.requiredApprovals : 1))
              message: "a serving phase (Approved/Active) with governance.approval.required=true requires at least requiredApprovals attestations in status.governance.approvals[] (governance approval gate)."
            # Grandfather transition rule — demands approval only when the
            # safety-enforcement posture is newly set (create) or changed
            # (update). Pre-existing agents with unchanged safety are
            # grandfathered, so admission never rejects an already-Approved
            # agent on re-apply (admission fires before the operator's
            # approval-satisfied grandfather can run).
            - rule: |
                !(has(self.spec.safety) && has(self.spec.safety.enforces) && self.spec.safety.enforces == true)
                || (oldSelf.hasValue() && has(oldSelf.value().spec.safety) && oldSelf.value().spec.safety == self.spec.safety)
                || (has(self.spec.governance) && has(self.spec.governance.approval)
                    && has(self.spec.governance.approval.required)
                    && self.spec.governance.approval.required == true)
              optionalOldSelf: true
              message: "spec.safety.enforces=true demands spec.governance.approval.required=true (no silent auto-approve). Pre-existing agents with unchanged safety are grandfathered."
            - rule: |
                !has(self.status) || !has(self.status.governance)
                || !has(self.status.governance.approvals)
                || !has(self.spec.governance) || !has(self.spec.governance.approval)
                || !has(self.spec.governance.approval.approverRole)
                || self.status.governance.approvals.all(a, !has(a.role) || a.role == self.spec.governance.approval.approverRole)
              message: "every status.governance.approvals[].role must match spec.governance.approval.approverRole (governance approval gate)."
          properties:
            spec:
              type: object
              description: "Desired state of the governed agent: identity (agentName/provider), agent card, dependencies, safety attestation, and provider-specific hosting config."
              required: ["agentName", "provider", "agentCard"]
              x-kubernetes-validations:
                # ── Provider requirement (dual-provider hosting) ──
                - rule: "self.provider != 'awsAgentCore' || has(self.awsAgentCore)"
                  message: "provider=awsAgentCore requires spec.awsAgentCore block"
                - rule: "self.provider != 'kubernetesPod' || has(self.kubernetesPod)"
                  message: "provider=kubernetesPod requires the spec.kubernetesPod block (dual-provider hosting)"
                # Mutual exclusion — exactly one provider block matching spec.provider
                - rule: |
                    !(has(self.kubernetesPod) && has(self.awsAgentCore))
                  message: "spec.kubernetesPod and spec.awsAgentCore are mutually exclusive; set exactly one matching spec.provider (dual-provider hosting)"
                - rule: |
                    !has(self.kubernetesPod) || self.provider == 'kubernetesPod'
                  message: "spec.kubernetesPod is only valid when spec.provider='kubernetesPod' (dual-provider hosting)"
                - rule: |
                    !has(self.awsAgentCore) || self.provider == 'awsAgentCore'
                  message: "spec.awsAgentCore is only valid when spec.provider='awsAgentCore' (dual-provider hosting)"
                # ── Enforcement-driver credential consistency ──
                # Mirrors the ModelConfig/ToolConfig credential rules: a secret-
                # bearing credential type requires a non-empty Secret reference.
                - rule: |
                    !has(self.credentialProviderType)
                    || !(self.credentialProviderType in ['API_KEY', 'OAUTH'])
                    || (has(self.credentialSecretRef) && self.credentialSecretRef != '')
                  message: "credentialProviderType=API_KEY|OAUTH requires a non-empty credentialSecretRef pointing to a Kubernetes Secret"
                # ── Network posture — provider-dispatched (neutrality fix) ──
                # The AWS subnet/securityGroup requirement applies ONLY to
                # provider=awsAgentCore. A kubernetesPod (or any non-AWS) agent
                # in VPC mode must NOT be forced to carry AWS-shaped
                # networkModeConfig — otherwise the rule is structurally
                # unsatisfiable for non-AWS providers and silently forces them
                # to networkMode=PUBLIC (the escape-hatch-tenant anti-pattern).
                - rule: |
                    !(has(self.networkMode) && self.networkMode == 'VPC')
                    || self.provider != 'awsAgentCore'
                    || (has(self.awsAgentCore) && has(self.awsAgentCore.networkModeConfig)
                        && has(self.awsAgentCore.networkModeConfig.subnets)
                        && has(self.awsAgentCore.networkModeConfig.securityGroups))
                  message: "networkMode=VPC with provider=awsAgentCore requires awsAgentCore.networkModeConfig with subnets and securityGroups"
                # ── Tool access goes through the perimeter, not around it ──
                # The refusal of awsAgentCore.agentCoreGatewayMcpUrl used to live
                # here, conditional on dependsOn.tools being non-empty. It moved
                # into the awsAgentCore block as an UNCONDITIONAL rule (owner
                # decision 2026-09-26, a design note Q1): a raw AgentCore Gateway URL
                # with no declared tool dependency is the same bypass, just
                # undeclared, and a field-local rule names the field in the
                # apiserver's message.
                # ── Immutability ──
                - rule: "oldSelf.provider == self.provider"
                  message: "spec.provider is immutable after creation"
                - rule: "oldSelf.agentName == self.agentName"
                  message: "spec.agentName is immutable after creation"
                # registryRef selects the discovery-catalog backing (Registry CR).
                # Immutable after creation: silently re-homing an asset's records
                # to a different catalog would orphan the prior registry's records
                # and break audit provenance. Optional set-once field: may be set later if absent at create, never removed or re-pointed.
                - rule: "!has(oldSelf.registryRef) || (has(self.registryRef) && oldSelf.registryRef == self.registryRef)"
                  message: "spec.registryRef is immutable once set (removing or re-pointing it would orphan the prior catalog's records)"
                # ── Cross-vendor neutrality rules ──
                # modelRef is a projection of one dependsOn.models entry ("lifted
                # from dependsOn.models"), so declaring it REQUIRES the dependsOn
                # declaration — previously the !has(dependsOn) guard allowed a
                # modelRef with no dependency edge, silently bypassing the
                # cross-asset dep gate. Grandfather: unchanged specs pass
                # (operator status-touch / annotate re-apply never rejected).
                - rule: |
                    (oldSelf.hasValue() && oldSelf.value() == self)
                    || !has(self.modelRef)
                    || (has(self.dependsOn) && has(self.dependsOn.models) && self.modelRef in self.dependsOn.models)
                  optionalOldSelf: true
                  message: "spec.modelRef must appear in spec.dependsOn.models (declaring modelRef requires the dependsOn.models dependency edge)"
                # toolRefs ⊆ dependsOn.tools enforced at admission — declaring
                # toolRefs REQUIRES the dependsOn.tools declaration (same
                # projection semantics as modelRef).
                # The K8s 1.30+ cost budget accommodates self.toolRefs.all() over maxItems:50.
                # An operator-side check remains as defense-in-depth.
                - rule: |
                    (oldSelf.hasValue() && oldSelf.value() == self)
                    || !has(self.toolRefs) || size(self.toolRefs) == 0
                    || (has(self.dependsOn) && has(self.dependsOn.tools) && self.toolRefs.all(t, t in self.dependsOn.tools))
                  optionalOldSelf: true
                  message: "every entry in spec.toolRefs must appear in spec.dependsOn.tools (declaring toolRefs requires the dependsOn.tools dependency edges)"
              properties:
                # ── Identity ──
                agentName:
                  type: string
                  description: |
                    Agent identity. Must match the AgentCore Runtime
                    agentRuntimeName pattern (alphanumerics, underscore, hyphen).
                    AWS AgentCore accepts both underscores and hyphens; we follow
                    the same constraint to avoid name-translation between
                    AgentConfig.spec.agentName and AgentCore Runtime API.
                  pattern: "^[a-zA-Z0-9]([-_a-zA-Z0-9]*[a-zA-Z0-9])?$"
                  maxLength: 63
                  minLength: 1
                  example: my-agent
                provider:
                  type: string
                  description: |
                    Hosting provider for this agent. Dual-provider support:
                      - awsAgentCore: AWS-managed AgentCore Runtime hosting (default).
                      - kubernetesPod: in-cluster Deployment + Service hosting, owned by
                        the asset's Component for cascade-delete via Canvas.
                    Both providers honor the same dependsOn semantics, governance metadata,
                    safety attestation (composition truthfulness invariant), and Registry
                    projection. The operator dispatches on this field. As an open contract with
                    an opinionated AWS reference implementation, the schema permits any leading-lowercase
                    alphanumeric provider id so sibling operators can register additional
                    providers without a CRD bump.
                  pattern: "^[a-z][a-zA-Z0-9-]*$"
                  minLength: 1
                  maxLength: 63
                  default: awsAgentCore
                  example: awsAgentCore
                paused:
                  type: boolean
                  default: false
                  description: "When true, the operator withdraws the agent's serving path / governance perimeter so it can no longer be invoked through the governed path (a soft kill-switch); the CR is retained for audit and can be un-paused."
                # ── Declarative spec lineage (TMF/GB1085 conformance anchor) ──
                specLineage:
                  type: object
                  description: "Declarative TMF specification lineage for this asset (conformance anchor; ref: GB1085 §4)."
                  properties:
                    sdo: { type: string, default: "TMForum", example: "TMForum" }
                    specification: { type: string, example: "GB1085 Model-as-a-Service v1.0.0" }
                    section: { type: string, example: "§1.3.1 Agent Developer enablement" }
                    sidEntity: { type: string, example: "LogicalResource" }

                # ── Cross-vendor neutrality fields ──
                # These fields keep the contract provider-neutral: governance is
                # declared once and applies regardless of which platform hosts the agent.
                # ── Registry reference ──
                # Points to a Registry CR that selects the backing catalog.
                # Optional — defaults to the annotated default Registry in
                # the modaas namespace. Follows K8s PVC.storageClassName /
                # Ingress.ingressClassName convention.
                registryRef:
                  type: object
                  description: "Reference to the Registry CR that this asset publishes to."
                  properties:
                    name:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      default: "modaas-system"
                      maxLength: 63
                networkMode:
                  type: string
                  # AgentCore NetworkConfiguration.networkMode Valid Values are
                  # PUBLIC | VPC (API reference, fetched 2026-09-26). The enum
                  # used to admit a third value, PRIVATE, that the API does not
                  # define: admission accepted such a CR and AWS rejected the
                  # create call. A provider-neutral field still cannot admit a
                  # value no provider implements.
                  enum: [PUBLIC, VPC]
                  default: PUBLIC
                  description: "Network posture for the agent runtime. PUBLIC=internet; VPC=in-VPC isolation. Maps to AgentCore networkMode (Valid Values: PUBLIC | VPC), Azure VNet, Vertex VPC-SC."
                modelRef:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  maxLength: 63
                  description: "Primary model alias. Lifted from dependsOn.models for MCP/Azure parity (Azure declarative: model.id; MCP: model ref). Operator injects as MODEL_ALIAS env var."
                toolRefs:
                  type: array
                  items:
                    type: string
                    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    maxLength: 63
                  maxItems: 50
                  description: "Tool aliases available to the agent. Mirrors Azure declarative tools[] and MCP client tool list. Operator projects as env-var TOOL_REFS or pre-registered tool access."

                # ── Agent Card (A2A discovery) ──
                agentCard:
                  type: object
                  description: "A2A-style agent card describing this agent to peers and consumers: its description, declared skills, supported interfaces, and protocol binding. Used for discovery and agent-to-agent interaction."
                  required: ["description", "skills"]
                  properties:
                    description:
                      type: string
                      maxLength: 512
                      minLength: 1
                    skills:
                      type: array
                      minItems: 1
                      items:
                        type: string
                    protocolBinding:
                      type: string
                      enum: ["HTTP+JSON", "HTTP+PROTO", "gRPC"]
                      default: "HTTP+JSON"
                    supportedInterfaces:
                      type: array
                      items:
                        type: string
                    # ── A2A parity additions ──
                    capabilities:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                      description: "Declared agent capabilities for A2A discovery. Examples: 'text-generation', 'tool-calling', 'multimodal', 'streaming'."
                    endpoints:
                      type: array
                      maxItems: 10
                      items:
                        type: object
                        required: ["name", "url"]
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                            maxLength: 63
                          url:
                            type: string
                            maxLength: 2048
                          protocol:
                            type: string
                            enum: [HTTP, HTTPS, MCP, gRPC]
                      description: "Agent endpoint publication for A2A handshake. Multiple endpoints supported (e.g. invoke, healthz, stream)."

                # ── Dependencies ──
                dependsOn:
                  type: object
                  description: "Cross-asset dependency declaration: the models and tools this agent invokes (parallel string arrays models[]/tools[]). Admission gates the agent on those dependencies being Approved; thereafter the dependency posture is surfaced as a status condition rather than force-torn-down."
                  properties:
                    models:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    tools:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"

                # ── Safety attestation (composition truthfulness invariant) ──
                # The AgentConfig author attests to whether the agent runtime
                # honors the safety contract of the dependency models/tools.
                # Cross-CR composition predicates cannot be evaluated at
                # admission CEL (which is restricted to fields of `self`).
                # The agent operator evaluates the predicate at first
                # reconcile: if a referenced ModelConfig declares
                # safety.required=true and the AgentConfig does not attest a
                # matching enforcerKind, the operator writes phase=Failed
                # with reason=EnforcementNotDeclared / EnforcerKindMismatch
                # and refuses to project the asset to the federated
                # registry. The candidate is admitted to the cluster but
                # never reaches phase=Approved and never serves traffic.
                #
                # Intra-CR self-contradiction IS refused at admission CEL on
                # this same schema. The cross-CR composition predicate runs
                # in the operator.
                safety:
                  type: object
                  description: "Agent-side safety attestation. Required when any dependsOn.models has safety.required=true."
                  properties:
                    enforces:
                      type: boolean
                      default: false
                      description: "AgentConfig author attests the runtime honors declared upstream safety contracts."
                    enforcerKind:
                      type: string
                      enum: [bedrockGuardrail, bedrockGuardrailExternal, gatewayFilter, external, none]
                      description: "Which enforcement kind the agent runtime honors. Must match upstream ModelConfig.spec.safety.enforcer.kind (enum kept in lockstep with ModelConfig for cross-CR composition)."
                    # ── Enforcement driver axis ──
                    enforcedAt:
                      type: string
                      pattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
                      default: self
                      example: self
                      description: "Enforcement driver — which gateway governs this agent's boundary. self=MoDaaS AI Gateway (default; the reference path that ships today); agentgateway/muleSoftAiGateway federate to an external driver (reserved for future sibling implementations). Orthogonal to provider."
                    enforcedBy:
                      type: string
                      description: "Free-form description of HOW enforcement is implemented (audit trail). E.g., 'strands-BedrockModel-guardrail-env', 'gateway-injection', 'sidecar-enforcer'."
                      maxLength: 256
                  x-kubernetes-validations:
                    # Composition truthfulness — enforces=true MUST declare a kind
                    - rule: "!self.enforces || has(self.enforcerKind)"
                      message: "safety.enforces=true requires safety.enforcerKind to be declared"
                    # enforces=false MUST NOT declare enforcerKind != 'none'
                    - rule: "self.enforces || !has(self.enforcerKind) || self.enforcerKind == 'none'"
                      message: "safety.enforces=false requires enforcerKind to be absent or 'none'"
                    # Composition truthfulness: enforces=true with kind='none' is contradictory.
                    # Mirrors ModelConfig's intra-CR truthfulness invariant (safety.required=true must not pair with enforcer.kind='none').
                    - rule: "!self.enforces || self.enforcerKind != 'none'"
                      message: "safety.enforces=true cannot combine with enforcerKind='none' (contradictory: agent claims to enforce while declaring no enforcement)"
                    # Same shape, over gatewayFilter (schema-reserved, zero implementation —
                    # confirmed no reconcile-time check exists in aws-agent-operator at all,
                    # the worse of the two CRDs this pattern applies to)
                    - rule: "!self.enforces || !has(self.enforcerKind) || self.enforcerKind != 'gatewayFilter'"
                      message: "safety.enforces=true cannot be combined with enforcerKind=gatewayFilter (schema-reserved, not yet implemented — use bedrockGuardrail, bedrockGuardrailExternal, or external)"

                # ── Enforcement-driver credentials (neutral vocab, shared with ToolConfig) ──
                credentialProviderType:
                  type: string
                  enum: [NONE, providerManaged, API_KEY, OAUTH]
                  default: NONE
                  description: "Neutral credential scope for the enforcement driver. Type only — actual secret in credentialSecretRef."
                credentialSecretRef:
                  type: string
                  maxLength: 253
                  description: "Name of Kubernetes Secret holding enforcement-driver credentials. Required when credentialProviderType is API_KEY or OAUTH. Credentials NEVER inline in CRD."

                # ── Governance ──
                governance:
                  type: object
                  description: "Governance metadata for this agent: ownership, data-classification, lifecycle/retirement, and the optional approval gate. Drives admission checks and the discovery-catalog record."
                  properties:
                    owner: { type: string }
                    costCenter: { type: string }
                    dataClassification:
                      type: string
                      enum: [public, internal, confidential, pii, regulated, restricted]
                    retirementDate:
                      type: string
                      format: date
                    # ── Governance Approval Gate ──
                    approval:
                      type: object
                      description: |
                        Human/policy approval gate. When required=true,
                        the operator parks the CR in phase=Reviewing until
                        a signed attestation from the role declared in
                        approverRole appears in status.governance.approvals[].
                        Default for required flips on spec.safety.enforces so
                        agents that don't attest enforcement keep auto-approving.
                      properties:
                        required:
                          type: boolean
                          description: "When unset, defaults to spec.safety.enforces (the approval gate auto-enables for safety-attesting agents; governance approval gate)."
                        requiredApprovals:
                          type: integer
                          minimum: 1
                          default: 1
                        approverRole:
                          type: string
                          description: "FQN role name. Defaults to modaas-agentconfig-<agentName>-admin (Canvas IdentityConfig + Keycloak provisioning)."
                          maxLength: 253

                # ── Access control ──
                access:
                  type: object
                  description: "Authorization overlay for this agent: a restrict-only (forbid) Cedar overlay and the required consumer role. It can narrow what this agent may do below what the target tools permit, never widen it (separation of duties)."
                  properties:
                    requiredRole:
                      type: string
                    cedarPolicy:
                      type: string

                # ── Agent-Action Policy Contract ──
                # Declarative agent-action policy intent. Distinct from
                # spec.safety (token-level content safety) — this block
                # governs principal-action-resource-context decisions
                # on tool invocation. The contract is engine-agnostic:
                # cedar | opa | avp | webhook | none. When required=true the
                # operator validates the referenced policy text and projects
                # it into a backing PDP (policy decision point) that the
                # agent's PEP (policy enforcement point) consults at tool-call time.
                agentPolicy:
                  type: object
                  description: |
                    Agent-action policy. When required=true, the
                    operator validates the policy text at reconcile and
                    projects it into the chosen PDP (Cedar in-cluster, AVP,
                    AgentCore Authorization, or webhook). The PEP (per-runtime)
                    consults the PDP before each tool call (reserved for future
                    sibling implementations; the in-cluster Cedar reference path
                    is what ships today). Fail-closed by default; per-engine
                    failMode override available.
                  properties:
                    required:
                      type: boolean
                      default: false
                      description: "When true, agent-action policy is mandatory; admission/operator refuses if engine block is missing or invalid."
                    engine:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [cedar, opa, avp, webhook, none]
                          description: "Policy engine. cedar = AWS reference; opa/avp/webhook = pluggable; none = explicit no-policy (only valid when required=false)."
                        cedar:
                          type: object
                          description: "Cedar engine config (AWS reference path). Used when engine.kind=cedar."
                          properties:
                            policyRef:
                              type: object
                              required: [configMap]
                              properties:
                                configMap:
                                  type: string
                                  maxLength: 253
                                  description: "Name of the ConfigMap holding the Cedar policy text (in the same namespace as the AgentConfig)."
                                key:
                                  type: string
                                  default: "policy.cedar"
                                  maxLength: 253
                                  description: "Key inside the ConfigMap whose value is the Cedar policy text."
                            pdpRef:
                              type: object
                              properties:
                                kind:
                                  type: string
                                  enum: [inCluster, avp, agentCoreAuth]
                                  description: "Where the policy decision point runs. inCluster = MoDaaS reference PDP (agent-action policy contract); avp = AWS Verified Permissions; agentCoreAuth = AgentCore Authorization."
                                policyStoreId:
                                  type: string
                                  description: "AVP policy store id (only when pdpRef.kind=avp)."
                                  maxLength: 256
                            principalAttributes:
                              type: object
                              description: "How to extract principal attributes for the decision request."
                              x-kubernetes-preserve-unknown-fields: true
                            resourceAttributes:
                              type: object
                              description: "How to extract resource attributes (e.g. from ToolConfig labels)."
                              x-kubernetes-preserve-unknown-fields: true
                            contextAttributes:
                              type: object
                              description: "How to extract decision context attributes."
                              x-kubernetes-preserve-unknown-fields: true
                          x-kubernetes-validations:
                            - rule: "has(self.policyRef) && has(self.policyRef.configMap)"
                              message: "agentPolicy.engine.cedar requires policyRef.configMap"
                        opa:
                          type: object
                          description: "OPA engine config. Used when engine.kind=opa."
                          properties:
                            bundleUrl:
                              type: string
                              maxLength: 2048
                              description: "URL of the OPA bundle (tar.gz) carrying the policy."
                            decisionPath:
                              type: string
                              maxLength: 256
                              description: "Decision path (e.g. agent/allow)."
                          x-kubernetes-validations:
                            - rule: "has(self.bundleUrl) && has(self.decisionPath)"
                              message: "agentPolicy.engine.opa requires bundleUrl and decisionPath"
                        webhook:
                          type: object
                          description: "Customer webhook PDP config. Used when engine.kind=webhook."
                          properties:
                            url:
                              type: string
                              maxLength: 2048
                              description: "PDP decision endpoint URL."
                            timeoutMs:
                              type: integer
                              minimum: 1
                              maximum: 30000
                              default: 50
                              description: "Decision RPC timeout in milliseconds."
                            failMode:
                              type: string
                              enum: [closed, open]
                              default: closed
                              description: "Behavior when PDP is unreachable. closed = deny; open = allow (NOT recommended for production)."
                          x-kubernetes-validations:
                            - rule: "has(self.url)"
                              message: "agentPolicy.engine.webhook requires url"
                      x-kubernetes-validations:
                        - rule: "has(self.kind)"
                          message: "agentPolicy.engine.kind is required when agentPolicy.engine is set"
                        # When kind is set, the corresponding engine.<kind> block must be populated
                        - rule: "self.kind != 'cedar' || has(self.cedar)"
                          message: "agentPolicy.engine.kind=cedar requires agentPolicy.engine.cedar block"
                        - rule: "self.kind != 'opa' || has(self.opa)"
                          message: "agentPolicy.engine.kind=opa requires agentPolicy.engine.opa block"
                        - rule: "self.kind != 'webhook' || has(self.webhook)"
                          message: "agentPolicy.engine.kind=webhook requires agentPolicy.engine.webhook block"
                  x-kubernetes-validations:
                    # required=true demands an engine block AND a non-'none' engine kind
                    - rule: "!self.required || has(self.engine)"
                      message: "agentPolicy.required=true requires agentPolicy.engine to be declared"
                    - rule: "!self.required || !has(self.engine) || self.engine.kind != 'none'"
                      message: "agentPolicy.required=true is incompatible with engine.kind=none (use required=false instead)"

                # ── AWS AgentCore runtime (one of two hosting providers) ──
                #
                # Two modes:
                #  1. IMPORT: set only agentRuntimeId to adopt a pre-existing runtime.
                #     Operator will not create/update/delete it. The runtime's
                #     execution role is OBSERVED from AWS and published as
                #     status.executionRoleArn; the IAM finding is advisory.
                #  2. MANAGED: set containerUri (+ optional region).
                #     Operator creates the runtime on first reconcile, updates on image change,
                #     deletes on CR deletion. The execution role is the single
                #     platform role from operator config
                #     (MODAAS_AGENTCORE_RUNTIME_ROLE_ARN, set by helm from the
                #     AgentCoreRuntimeRoleArn stack output) — NOT from this CR.
                awsAgentCore:
                  type: object
                  description: "Provider-specific configuration when provider=awsAgentCore (the managed runtime that hosts this agent). One of the two reference hosting providers (with kubernetesPod) the AWS implementation realizes; matched to spec.provider (CEL-enforced)."
                  properties:
                    agentRuntimeId:
                      type: string
                      description: "Existing AgentCore Runtime id to import (leave containerUri unset)."
                      minLength: 1
                    containerUri:
                      type: string
                      description: |
                        ECR image URI for managed mode. Implies operator owns the runtime.
                        Reference the image by tag (repo:tag) or by digest
                        (repo@sha256:...), not both: AgentCore Runtime accepts
                        repo:tag@sha256:... and reports the runtime READY, but the
                        container never starts (measured 2026-09-28, every invoke
                        timed out with no log line).
                      minLength: 1
                      # The AgentCore API's own maximum. Also what lets CEL
                      # admit the regex below: its cost estimator refuses a
                      # match over a string with no declared length.
                      maxLength: 1024
                      x-kubernetes-validations:
                        - rule: "!self.matches('^[^@]*/[^/:@]+:[^/@]+@')"
                          message: "awsAgentCore.containerUri must reference the image by tag (repo:tag) or by digest (repo@sha256:...), not both: AgentCore Runtime accepts both together, but the container never starts"
                    roleArn:
                      type: string
                      description: |
                        IMPORT MODE ONLY, and ignored there. Refused at admission
                        whenever containerUri is set: a managed runtime executes as
                        the single platform execution role from operator config
                        (MODAAS_AGENTCORE_RUNTIME_ROLE_ARN), because a caller who
                        names the execution role names their own capability, and
                        "the perimeter is the only path" stops being a property.
                        In import mode the operator reads the role AWS reports for
                        the existing runtime and publishes it as
                        status.executionRoleArn; a value here is not read.
                      # Constrained to a regex matching real IAM role ARNs
                      # (matches the SageMaker pattern used elsewhere in this CRD).
                      pattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
                    region:
                      type: string
                      description: "AWS region for the runtime (default: the operator's own Region, from AWS_REGION/AWS_DEFAULT_REGION)."
                      minLength: 1
                    # ─── Two REMOVED fields, still declared on purpose ───
                    # This schema is structural with no preserve-unknown-fields on
                    # awsAgentCore, so a property deleted outright is PRUNED on the
                    # way in — silently. An operator setting it would see the apply
                    # succeed and believe the setting took. Keeping the property
                    # declared is what gives the CEL rules below something to see
                    # and the caller a message naming the field.
                    agentCoreGatewayMcpUrl:
                      type: string
                      description: |
                        REMOVED. Refused at admission in ANY mode and never injected.
                        A raw AgentCore Gateway URL lets the agent skip agentgateway +
                        Cedar; the governed perimeter MCP URL is derived from
                        dependsOn.tools (/mcp/<alias>, a design note) and published as
                        status.endpoint. Declared only so the refusal can name the
                        field instead of the value being silently pruned.
                      minLength: 1
                    skipEnvInjection:
                      type: boolean
                      # NO `default:` — a defaulted property is materialized into
                      # every stored spec, which would make the !has() refusal below
                      # reject every AgentCore CR in existence.
                      description: |
                        REMOVED. Refused at admission in ANY mode. This was the
                        a design note SDK-redirect opt-out: true meant the operator injected
                        no AWS_ENDPOINT_URL_* / OPENAI_BASE_URL, i.e. the agent's
                        calls did not traverse the governance perimeter. An opt-out
                        from a guardrail is a documented bypass (project.md: "the
                        litellm failure class is the exact failure MoDaaS exists to
                        eliminate"), so the redirect is now unconditional. Declared
                        only so the refusal can name the field instead of the value
                        being silently pruned.
                    # ─── authorizerConfiguration (governance pass-through) ───
                    # Lets the AgentCore Runtime accept the same JWT tokens as
                    # the AI Gateway (consistent Keycloak reachability).
                    authorizerConfiguration:
                      type: object
                      description: "Optional: AgentCore Runtime authorizer (e.g. customJWTAuthorizer pointing at Keycloak)."
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        customJWTAuthorizer:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            discoveryUrl:
                              type: string
                              description: "OIDC discovery URL of the JWT issuer (e.g. Keycloak realm)."
                            allowedAudience:
                              type: array
                              items: { type: string }
                            allowedClients:
                              type: array
                              items: { type: string }
                            allowedScopes:
                              type: array
                              items: { type: string }
                    # ─── protocolConfiguration (governance pass-through) ───
                    # Declares which protocol the agent container serves. AgentCore
                    # Runtime uses this to route incoming requests correctly.
                    protocolConfiguration:
                      type: object
                      description: "Optional: protocol the agent serves (MCP/HTTP/A2A)."
                      properties:
                        serverProtocol:
                          type: string
                          enum: [MCP, HTTP, A2A]
                          description: "Protocol the agent container speaks."
                    # ─── lifecycleConfiguration (governance pass-through) ───
                    # Governance-relevant: idle session timeout + max lifetime. Enables
                    # bounded-lifetime for sensitive workloads and cost controls on
                    # long-lived agents.
                    lifecycleConfiguration:
                      type: object
                      description: "Optional: AgentCore Runtime session lifecycle tuning."
                      properties:
                        idleRuntimeSessionTimeout:
                          type: integer
                          minimum: 0
                          description: "Seconds. 0 = no idle timeout."
                        maxLifetime:
                          type: integer
                          minimum: 0
                          description: "Seconds. 0 = no max lifetime cap."
                    # ─── requestHeaderConfiguration pass-through ───
                    # AgentCore CreateAgentRuntime/UpdateAgentRuntime accept
                    # requestHeaderConfiguration: the HTTP request headers AgentCore
                    # forwards into the runtime. Governance-relevant: without
                    # traceparent/baggage the evidence chain mints a fresh root span
                    # per hop and cannot join the caller's trace (a design note). Omit the
                    # block to accept the MoDaaS default allowlist
                    # (traceparent, baggage, plus Authorization when
                    # authorizerConfiguration.customJWTAuthorizer is set -- AgentCore
                    # refuses Authorization without one); declaring it wins verbatim.
                    #
                    # Bounds mirror the API reference (fetched 2026-09-26):
                    # 1..20 entries, each 1..256 chars matching
                    # [A-Za-z][A-Za-z0-9_-]{0,255}.
                    requestHeaderConfiguration:
                      type: object
                      description: "Optional: HTTP request headers AgentCore forwards into the runtime. Union — requestHeaderAllowlist is its only member."
                      properties:
                        requestHeaderAllowlist:
                          type: array
                          minItems: 1
                          maxItems: 20
                          items:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: "^[A-Za-z][A-Za-z0-9_-]{0,255}$"
                          description: "Header names forwarded to the runtime (e.g. traceparent, baggage). Authorization is accepted only with authorizerConfiguration.customJWTAuthorizer."
                    # ─── environmentVariables pass-through ───
                    # AgentCore's native environmentVariables: the agent's own
                    # settings (role, evidence store, step numbering). Without it an
                    # AgentCore-hosted agent could be told nothing the operator does
                    # not derive itself. The operator refuses any name it owns (the
                    # gateway redirect, the gateway credential, provider credentials,
                    # REGION/REGISTRY_ID/MODEL_ALIAS/TOOL_ALIAS, AWS_ENDPOINT_URL*):
                    # operators/shared/agentcore_env.py. Bounds are the API's.
                    environmentVariables:
                      type: object
                      description: "Optional: environment variables for the agent container (AgentCore environmentVariables). Names the operator owns are refused. Values are plain text in this CR and in the runtime's configuration."
                      maxProperties: 50
                      additionalProperties:
                        type: string
                        maxLength: 5000
                    # ─── networkModeConfig pass-through (governance-relevant) ───
                    # Required when spec.networkMode is VPC. Declares the subnets +
                    # security groups the runtime attaches to. Governance-relevant:
                    # dataClassification=restricted + networkMode=PUBLIC is a
                    # contradiction; restricted workloads should run in VPC mode with
                    # declared network posture.
                    networkModeConfig:
                      type: object
                      description: "Required when spec.networkMode is VPC."
                      properties:
                        subnets:
                          type: array
                          minItems: 1
                          items:
                            type: string
                            pattern: "^subnet-[0-9a-f]{8,17}$"
                          description: "VPC subnet IDs the runtime attaches to."
                        securityGroups:
                          type: array
                          minItems: 1
                          items:
                            type: string
                            pattern: "^sg-[0-9a-f]{8,17}$"
                          description: "Security group IDs applied to the runtime ENIs."
                  x-kubernetes-validations:
                    # Managed mode needs only the image. roleArn was half of this
                    # requirement until 2026-09-26; requiring what the next rule
                    # refuses would leave no satisfiable managed shape at all.
                    - rule: "has(self.agentRuntimeId) || has(self.containerUri)"
                      message: "awsAgentCore requires either agentRuntimeId (import) or containerUri (managed)"
                    # Import and managed modes are mutually exclusive — a block
                    # carrying both leaves the operator's mode dispatch ambiguous.
                    # Grandfather: an unchanged block passes (ratchet on edit/create).
                    - rule: |
                        (oldSelf.hasValue() && oldSelf.value() == self)
                        || !(has(self.agentRuntimeId) && has(self.containerUri))
                      optionalOldSelf: true
                      message: "awsAgentCore.agentRuntimeId (import mode) and awsAgentCore.containerUri (managed mode) are mutually exclusive; declare exactly one hosting mode"
                    # ─── The three gateway-bypass refusals ───
                    # Owner decision 2026-09-26 (a design note Q1 = option b). One rule
                    # per field so the apiserver's message names exactly which
                    # field is wrong. No optionalOldSelf grandfather: these are
                    # the refusals, and a CR that keeps the field keeps the bypass.
                    # On K8s >= 1.30 CRDValidationRatcheting still lets an
                    # operator status write through when the awsAgentCore subtree
                    # is unchanged (UNVERIFIED here — no cluster in this lane).
                    - rule: "!has(self.roleArn) || !has(self.containerUri)"
                      message: "awsAgentCore.roleArn must not be set in managed mode (containerUri): a MoDaaS-created runtime executes as the single platform execution role supplied by operator config (MODAAS_AGENTCORE_RUNTIME_ROLE_ARN, set by helm from the AgentCoreRuntimeRoleArn stack output). Remove the field."
                    - rule: "!has(self.agentCoreGatewayMcpUrl)"
                      message: "awsAgentCore.agentCoreGatewayMcpUrl is removed: a raw AgentCore Gateway URL bypasses agentgateway + Cedar. The governed MCP URL is derived from dependsOn.tools and published as status.endpoint. Remove the field."
                    - rule: "!has(self.skipEnvInjection)"
                      message: "awsAgentCore.skipEnvInjection is removed: the MoDaaS perimeter redirect is not optional. Remove the field."

                # ── Kubernetes Pod hosting ──
                # Required when spec.provider=kubernetesPod. The operator creates a
                # Deployment + Service in the components namespace, owned by
                # the asset's Component CR for cascade-delete.
                kubernetesPod:
                  type: object
                  description: |
                    Kubernetes Pod hosting backend. The operator
                    reconciles a Deployment + ClusterIP Service named agent-<name> in
                    the components namespace. The Component CR owns both objects
                    (cascade-delete on Component removal). SDK redirect env
                    vars are injected into the Deployment env block automatically.
                  required: ["containerImage"]
                  properties:
                    containerImage:
                      type: string
                      description: "Container image URI the agent runs (e.g., my-org/my-agent:1.2.0 or ECR URI)."
                      minLength: 1
                      maxLength: 1024
                    port:
                      type: integer
                      description: "TCP port the agent's HTTP server listens on."
                      minimum: 1
                      maximum: 65535
                      default: 8080
                    replicas:
                      type: integer
                      description: "Deployment replica count."
                      minimum: 0
                      maximum: 50
                      default: 1
                    serviceAccountName:
                      type: string
                      description: |
                        ServiceAccount the agent pod runs under. Defaults to
                        modaas-agent-default (provisioned by the modaas Helm chart).
                        Override when the agent needs IRSA or extra K8s permissions.
                      maxLength: 253
                    env:
                      type: array
                      description: |
                        User-supplied env vars merged ON TOP OF the SDK redirect
                        vars and legacy back-compat vars (REGION, REGISTRY_ID,
                        MODEL_ALIAS, TOOL_ALIAS). User keys win on conflict.
                      maxItems: 50
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            maxLength: 253
                          value:
                            type: string
                            maxLength: 4096
                          valueFrom:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: "Standard K8s EnvVarSource (configMapKeyRef, secretKeyRef, fieldRef, resourceFieldRef)."
                    resources:
                      type: object
                      description: "Container resource requests + limits. Defaults applied when unset."
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:    { type: string, default: "100m" }
                            memory: { type: string, default: "128Mi" }
                        limits:
                          type: object
                          properties:
                            cpu:    { type: string, default: "500m" }
                            memory: { type: string, default: "512Mi" }
                    imagePullSecrets:
                      type: array
                      description: "Image pull secrets to attach to the agent pod."
                      maxItems: 8
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            maxLength: 253
                    # ── a design note capability withholding ──
                    # a design note's decision is that the perimeter is made the ONLY
                    # path to a governed asset by withholding capability from the
                    # workload, not by redirecting it. For a pod the mechanisms
                    # are: no provider credentials in the pod's ServiceAccount or
                    # environment, and NetworkPolicy egress only to the gateway
                    # (and DNS). The operator refuses, rather than warns, when a
                    # leg is verified absent. These two fields are the declared,
                    # auditable exits from that default.
                    networkPolicy:
                      type: string
                      enum: [enforce, "off"]
                      default: enforce
                      description: |
                        Whether the operator emits the per-agent egress
                        NetworkPolicy agent-<name>-egress (DNS + the gateway
                        namespace, nothing else). `off` is an explicit opt-out:
                        the asset is still admitted, but
                        status.kubernetesPod.capabilityWithheld becomes false and
                        withholdingFindings records that no egress restriction was
                        installed. There is no cluster-wide off switch by design.
                    allowServiceAccountCloudIdentity:
                      type: boolean
                      default: false
                      description: |
                        Admit a ServiceAccount that confers cloud identity on the
                        pod. Two detections, because the cluster exposes cloud
                        identity two ways: an annotation on the SA object
                        (eks.amazonaws.com/role-arn,
                        azure.workload.identity/client-id,
                        iam.gke.io/gcp-service-account), and — for an EKS Pod
                        Identity association, which is an EKS API resource with no
                        SA annotation — the witness EKS injects into the pod
                        (AWS_CONTAINER_CREDENTIALS_FULL_URI, the
                        eks-pod-identity-token volume). Default false REFUSES
                        such an SA: a pod able to obtain provider credentials can
                        reach the provider without crossing the perimeter. Set
                        true only when the agent needs cloud identity for
                        something other than model or tool access — the operator
                        cannot verify that (it holds no IAM permission), so this
                        is an attestation by the author, recorded in
                        status.kubernetesPod.withholdingFindings.

            # ═════════════════════════════════════════════════════════════════
            # STATUS
            # ═════════════════════════════════════════════════════════════════
            status:
              type: object
              x-kubernetes-validations:
                # A globalResourceEndpoint immutability rule was removed while the
                # field is still being shaped (path scheme, scope semantics) and
                # operator drift corrections land. Re-add once a stable contract
                # is published.
                # REFUSE a status patch transitioning to phase=Approved without
                # globalResourceEndpoint set in the same patch. CEL has no warn
                # modality, so this rule hard-rejects. The operator MUST write
                # phase + globalResourceEndpoint in the same patch.status call.
                - rule: |
                    !has(self.phase) || self.phase != 'Approved' || has(self.globalResourceEndpoint)
                  message: "status.globalResourceEndpoint MUST be set when phase=Approved (operator must write both in the same status patch)"
                # ── Admission CEL invariants (claim verification) ──
                # Deferred: globalResourceEndpoint scope vs consumers.
                #   Activate once status.boundPublicConsumers (list) is added.
                #   Intent: refuse Approved + endpointScope=mesh when public-vantage
                #   consumers are bound. K8s CEL rejects unknown structural-schema
                #   field paths even when has()-guarded, so this rule lands with the field.
                # Deferred: effectiveNetworkMode=PUBLIC + Approved must carry
                #   status.endpoints.public. Activate once status.endpoints schema lands
                #   (currently only spec.agentCard.endpoints exists).
                # Deferred: IdentityProvisioned=True ↔ non-empty
                #   status.identityConfigRef. Activate once identityConfigRef is
                #   promoted into the status schema. Until then operator-owned.
                # Enforced (cascade-observability + composition-truthfulness reaffirmation):
                #   when conditions includes DependencyHealthy=False, phase MUST NOT be
                #   Approved. Catches the silent-fail mode where dependency cascade was
                #   bypassed but the AgentConfig still claims Approved.
                - rule: |
                    !has(self.conditions)
                    || !(has(self.phase) && self.phase == 'Approved')
                    || self.conditions.all(c,
                         c.type != 'DependencyHealthy' || c.status != 'False')
                  message: "phase=Approved is incompatible with DependencyHealthy=False; a cross-asset dependency cascade was violated (cascade observability + composition truthfulness)."
              properties:
                # ── kopf handler results ─────────────────────────────────────────────
                # kopf persists each handler's RETURN VALUE at status.<handler_id>. These were not
                # declared, and status has no x-kubernetes-preserve-unknown-fields, so the API stripped
                # them and every reconcile logged:
                #   Patching failed with inconsistencies: (('remove', ('status','reconcile'), ...))
                # That warning is identical whether the dropped field is kopf bookkeeping or a field the
                # operator genuinely meant to publish, so a constant benign version of it cannot warn about
                # the dangerous one. Declared explicitly rather than via preserve-unknown-fields so a
                # genuinely mistyped status key still gets rejected.
                reconcile:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: kopf handler result for reconcile() — diagnostic, not API surface.
                resync_from_registry:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: kopf handler result for resync_from_registry() — diagnostic, not API surface.
                scan_orphan_records:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: kopf handler result for scan_orphan_records() — diagnostic, not API surface.
                cleanup:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: kopf handler result for cleanup() — diagnostic, not API surface.
                check_dependency_health:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: kopf handler result for check_dependency_health() — diagnostic, not API surface.
                phase:
                  type: string
                  # Reviewing sits between Pending and Approved (governance approval gate).
                  # Phase machines intentionally differ per asset kind: an agent has
                  # real infrastructure to bring up after governance passes, so
                  # Approved (governance passed) and Active (runtime hosted, serving)
                  # are distinct states.
                  enum: [Pending, Reviewing, Approved, Active, Failed, Paused, Retired]
                reason: { type: string, maxLength: 512 }
                observedGeneration: { type: integer }
                lastReconciled: { type: string, format: date-time }
                agentCardUrl: { type: string }
                virtualServiceName: { type: string }
                keycloakRoleId: { type: string }
                agentRuntimeId:
                  type: string
                  description: "AgentCore Runtime id (present when provider=awsAgentCore)"
                agentRuntimeArn:
                  type: string
                  description: "AgentCore Runtime ARN (present when provider=awsAgentCore)"
                hostingProvider:
                  type: string
                  enum: [awsAgentCore, kubernetesPod]
                  description: "Effective hosting provider selected by the operator (dual-provider hosting)"
                # ── Status block for Kubernetes Pod hosting ──
                kubernetesPod:
                  type: object
                  description: "Backing Deployment + Service names when provider=kubernetesPod (dual-provider hosting)."
                  properties:
                    deploymentName:
                      type: string
                      description: "Name of the operator-managed Deployment in the components namespace."
                      maxLength: 253
                    serviceName:
                      type: string
                      description: "Name of the operator-managed ClusterIP Service in the components namespace."
                      maxLength: 253
                    ready:
                      type: boolean
                      description: "True when Deployment.status.readyReplicas == spec.kubernetesPod.replicas."
                    networkPolicyName:
                      type: string
                      description: "Name of the operator-managed per-agent egress NetworkPolicy (a design note). Empty when spec.kubernetesPod.networkPolicy=off."
                      maxLength: 253
                    capabilityWithheld:
                      type: boolean
                      description: |
                        True only when EVERY a design note withholding leg was verified in
                        place. An unverified leg (e.g. no NetworkPolicy-enforcing
                        controller could be recognised) makes this false: a claim
                        MoDaaS cannot substantiate is not made.
                    podTemplateLabelsConverged:
                      type: boolean
                      description: |
                        False while the pod template still carries the previous
                        manager's app.kubernetes.io/managed-by value. Correcting it
                        would roll the pods, and a design note's migration requires
                        adoption WITHOUT restarting existing agents, so the label
                        converges on the next reconcile that already changes the
                        pod template.
                    adoptedFrom:
                      type: string
                      description: "The app.kubernetes.io/managed-by value this Deployment carried before k8s-agent-operator took ownership (e.g. aws-agent-operator). Absent on a freshly created agent."
                      maxLength: 253
                    withholdingFindings:
                      type: array
                      description: "One entry per a design note withholding leg, with the result the operator actually observed. This is the evidence behind capabilityWithheld; an 'unverified' result names what could not be checked."
                      maxItems: 16
                      items:
                        type: object
                        properties:
                          leg:
                            type: string
                            description: "serviceAccountIdentity | podIdentityAssociation | environmentCredentials | networkPolicyEnforced"
                            maxLength: 64
                          result:
                            type: string
                            enum: [pass, fail, unverified]
                          detail:
                            type: string
                            maxLength: 2048
                          declaredOptOut:
                            type: boolean
                            description: "True when this leg is absent by explicit declaration (spec.kubernetesPod.networkPolicy=off) rather than by failure. Admitted, but still not 'withheld'."
                managed:
                  type: boolean
                  description: "True if operator created the runtime (managed mode); false if imported"
                # ── Which execution role this agent actually runs as ──
                # Managed mode: the platform role from operator config. Import
                # mode: the role AWS reports for the adopted runtime, which is the
                # only way an operator can see it without an AWS console trip.
                # Declared per Coherence Rule 20 — an undeclared status write is
                # silently stripped by the apiserver. No `pattern`: import mode
                # publishes whatever AWS returns, and a regex here would make an
                # unexpected-but-real ARN unpublishable.
                executionRoleArn:
                  type: string
                  maxLength: 2048
                  description: "Execution role the AgentCore Runtime actually runs as. Managed mode: the single platform role from operator config (MODAAS_AGENTCORE_RUNTIME_ROLE_ARN) — never from the CR. Import mode: observed from AWS. Absent when no role could be observed."
                # IAM-inspection findings recorded when adopting an existing runtime
                # (warning-level; never blocks approval). Declared so the operator's
                # write is not silently stripped — these are a security signal.
                riskFindings:
                  type: array
                  description: "Advisory IAM-posture findings from inspecting an adopted runtime's role (severity/code/message). Warning-level; does not block approval."
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                # ── Observability fields ──
                agentRuntimeVersion:
                  type: string
                  description: "AgentCore Runtime version identifier (observability, not CRD input)"
                workloadIdentityArn:
                  type: string
                  description: "AWS workload identity ARN attached to the runtime (audit trail)"
                effectiveNetworkMode:
                  type: string
                  enum: [PUBLIC, VPC]
                  description: "Network mode actually applied by the operator (may differ from spec if operator downgraded for safety). AgentCore Valid Values: PUBLIC | VPC."
                registryRecordId:
                  type: string
                  description: "Governance-registry record key. Convention: <provider>_<asset_id>, both halves normalized (lowercase, '_'->'-', leading-alpha). Unified pattern across ModelConfig/ToolConfig/AgentConfig."
                  pattern: "^[a-z][a-z0-9-]*_[a-z][a-z0-9-]*$"
                registryRecordUid:
                  type: string
                  description: "Observed identifier the Registry SERVICE assigned to this asset's record (AWS Agent Registry: 12 mixed-case alphanumerics). Distinct from registryRecordId, which is MoDaaS's own <provider>_<asset_id> convention key and cannot hold a service-assigned id without breaking its pattern. Additive (a design note PR 2); empty when the backing returns no id."
                  maxLength: 128
                registryApprovalId:
                  type: string
                  description: "Observed identifier minted for the approval projection that produced the current record state. Unique per approval, so two approvals of the same alias are distinguishable and a re-approval after a spec change is not mistaken for the first. Also carried in the record's own statusReason (a design note PR 2)."
                  maxLength: 64
                registryApprovalStatus:
                  type: string
                  description: "Observed registry state from timer-driven resync."
                  enum: [APPROVED, DRAFT, PENDING, DEPRECATED, MISSING, UNKNOWN]
                # ── Registry backing reference (status mirror) ──
                registryBackingRef:
                  type: object
                  description: "Observed backing that received this asset's record at last reconcile."
                  properties:
                    name:
                      type: string
                      description: "Registry CR name that was resolved."
                    backing:
                      type: string
                      description: "Backing kind (agentcore | tmf639 |...)."
                    recordId:
                      type: string
                      description: "Backing-specific record id (e.g., AgentCore recordId)."
                    observedAt:
                      type: string
                      format: date-time
                    statusReason:
                      type: string
                      maxLength: 512
                      description: "T8: human-readable reason from the backing's underlying registry record (AWS Agent Registry statusReason), when the backing captured one. Not the record's approval STATE (see status.registryApprovalStatus) — this is WHY, that field is WHAT."
                registryLastObserved:
                  type: string
                  format: date-time
                  description: "Wall-clock time of last resync from registry (@timer every 5 min)."
                driftDetected:
                  type: boolean
                  description: "True when CR state contradicts registry state."
                driftReason:
                  type: string
                  maxLength: 256
                  description: "Human-readable explanation when driftDetected=true."
                tmf639ResourceId:
                  type: string
                  description: "TMF639 Resource ID from Canvas Resource Inventory v5 (Canvas-native projection)."
                daysUntilRetirement: { type: integer }
                # ── Governance perimeter URL ──
                # The operator writes status.endpoint; this property MUST be
                # declared in the schema, otherwise K8s silently strips the
                # write and the field stays empty.
                endpoint:
                  type: string
                  description: "Governed runtime URL agents MUST call. Per-wire-format path (e.g. .../mcp/<alias> for gateway-fronted agents, or the AgentCore Runtime ARN for direct-runtime agents). Status-driven discovery clients read THIS, not upstreamEndpoint, to stay on the governed path."
                # Per-scope governed endpoint map {scope: url} the operator publishes
                # via the shared perimeter-URL helper. Open object (dynamic scope keys)
                # — declared so K8s does not silently strip the operator's write.
                endpoints:
                  type: object
                  description: "Per-scope governed endpoint URLs the operator resolved for this asset. The single best one is mirrored to status.endpoint."
                  x-kubernetes-preserve-unknown-fields: true
                # Per-dialect governed endpoint map {wireFormat: bestUrl}, one
                # entry per wire format this asset's provider declares
                # (wire_format_registry.dialects_for(provider)). Open object
                # (dynamic wire-format keys) — declared here so K8s does not
                # silently strip the operator's write.
                dialectEndpoints:
                  type: object
                  description: "Per-dialect governed endpoint URL, one entry per wire format this asset's provider declares (dialects_for(provider)). Each value is the same best-reachable-scope URL pick_best_endpoint would choose for that dialect alone. status.endpoint/globalResourceEndpoint continue to mirror only the PRIMARY dialect (dialects_for(provider)[0]) for backward compatibility with existing callers; this field is the FR-2-required per-dialect discovery surface."
                  x-kubernetes-preserve-unknown-fields: true
                upstreamEndpoint:
                  type: string
                  description: "Raw provider URL behind the gateway (AgentCore Runtime ARN / Gateway MCP URL). Diagnostics only — agents that call this directly bypass MoDaaS governance and provider-agnostic guardrail enforcement."
                # ── Global Resource Endpoint + scope ──
                globalResourceEndpoint:
                  type: string
                  format: uri
                  description: |
                    Stable, externally-resolvable URL representing the governance perimeter
                    for this asset. Set by the operator on transition to Approved. Immutable
                    thereafter. Format: https://<gateway-host>/<wire-format>/<asset-uid>.
                endpointScope:
                  type: string
                  enum: [mesh, vpc, public]
                  description: |
                    Resolvable scope of globalResourceEndpoint. mesh = cluster-internal only;
                    vpc = VPC-internal; public = externally addressable.
                # ── Observed enforcement driver (BR-8/a design note) ──
                observedEnforcedAt:
                  type: string
                  description: >-
                    Observed enforcement driver, read from the Accepted condition in
                    AgentgatewayModel.status.parents[].conditions — NOT an echo of
                    spec.safety.enforcedAt. Drift between the declared
                    and observed values means the dataplane has not (yet, or ever) accepted the route this
                    asset's declaration names. Populated by the operator's reconcile loop; absent until the
                    first successful read.
                componentRef:
                  type: object
                  description: "Canvas Component CR that owns this asset (set by operator after Component emission)."
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      type: string
                tmf639Resource:
                  type: object
                  description: "TMF639 v5 Resource Inventory record this asset projects to."
                  properties:
                    id:
                      type: string
                      description: "Stable TMF639 resource ID."
                    url:
                      type: string
                      format: uri
                      description: "Direct URL to the TMF639 record (e.g., RI baseUrl + /resource/{id})."
                audit:
                  type: object
                  description: "Addressable audit pointers for this asset."
                  properties:
                    logGroup:
                      type: string
                      description: "CloudWatch log group name."
                    queryUrl:
                      type: string
                      format: uri
                      description: "Pre-built CloudWatch Logs Insights query URL."
                # ── Governance approval audit trail ──
                governance:
                  type: object
                  description: "Governance approval state, Reviewing → Approved gate."
                  properties:
                    approvals:
                      type: array
                      description: "Append-only list of signed approval attestations."
                      items:
                        type: object
                        required: [subject, role, at]
                        properties:
                          subject: { type: string, maxLength: 253 }
                          role: { type: string, maxLength: 253 }
                          attestation: { type: string, maxLength: 2048 }
                          signature: { type: string, maxLength: 4096 }
                          at: { type: string, format: date-time }
                    awaitingSince:
                      type: string
                      format: date-time
                      nullable: true
                    rejectedAt:
                      type: string
                      format: date-time
                      nullable: true
                    rejectedReason:
                      type: string
                      maxLength: 256
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                dependencyStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # ── `dependencyHealthy` is written by the operator (cascade
                # observability) and MUST be declared in the schema, otherwise
                # K8s silently strips the boolean.
                dependencyHealthy:
                  type: boolean
                  description: "Cascade observability — top-level convenience scalar mirroring the DependencyHealthy condition. True iff every dependency has reached its kind's serving state (ModelConfig: Approved — models have no Active phase; ToolConfig: Active)."
                # ── Perimeter reachability (review goal 1(c) / P0-1) ──
                # Scalar mirror of the PerimeterReachable condition, same
                # convention as dependencyHealthy above. False means the operator
                # redirected this agent at the governance perimeter but could not
                # give it a credential the perimeter accepts, so its calls are
                # refused 403 — the state that used to be silent on the AgentCore
                # path. Absent (rather than false) when the answer is Unknown:
                # adopt mode, where the operator does not manage the runtime's
                # environment at all. Declared so the apiserver does not strip it.
                perimeterReachable:
                  type: boolean
                  description: "True when the operator both redirected this agent to the MoDaaS perimeter AND supplied a credential the perimeter accepts. False when the redirect exists without a usable credential (calls are refused 403). Absent when the operator does not manage the workload's environment (adopt mode) — read the PerimeterReachable condition for the reason."
                # ── Agent-Action Policy status mirror ──
                # The operator publishes the engine selected, the PDP location,
                # readiness of the PDP, and lightweight decision counters for
                # observability. The schema declares the block so K8s does not
                # silently strip operator writes.
                agentPolicy:
                  type: object
                  description: "Agent-action policy status mirror. Populated by the agent operator when spec.agentPolicy is declared (agent-action policy contract)."
                  properties:
                    engineKind:
                      type: string
                      enum: [cedar, opa, avp, webhook, none]
                      description: "Engine the operator resolved from spec.agentPolicy.engine.kind."
                    pdpKind:
                      type: string
                      enum: [inCluster, avp, agentCoreAuth, opa, webhook, none]
                      description: "Effective PDP backend (Cedar inCluster/avp/agentCoreAuth, or the engine kind itself for non-Cedar)."
                    pdpReady:
                      type: boolean
                      description: "True when the PDP backend has loaded the projected policy and is reachable."
                    projectedConfigMap:
                      type: string
                      maxLength: 253
                      description: "Name of the projected ConfigMap in modaas-system that the PDP consumes (Cedar inCluster path)."
                    lastValidatedAt:
                      type: string
                      format: date-time
                      description: "Timestamp of the last successful policy syntax validation."
                    lastDecision:
                      type: object
                      description: "Lightweight policy-decision counters (populated once agent-action-policy wiring is in place)."
                      properties:
                        allowed:
                          type: integer
                          minimum: 0
                        denied:
                          type: integer
                          minimum: 0
                        lastEvaluatedAt:
                          type: string
                          format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Agent,    type: string,  jsonPath: .spec.agentName }
        - { name: Provider, type: string,  jsonPath: .spec.provider }
        - { name: Phase,    type: string,  jsonPath: .status.phase }
        - { name: Reason,   type: string,  jsonPath: .status.reason }
        - { name: Paused,   type: boolean, jsonPath: .spec.paused, priority: 1 }
        - { name: Reg,      type: string,  jsonPath: .status.registryApprovalStatus, priority: 1 }
        - { name: Drift,    type: boolean, jsonPath: .status.driftDetected, priority: 1 }
        - { name: Registry, type: string, jsonPath: .spec.registryRef.name, priority: 1 }
        - { name: Global-Endpoint, type: string, jsonPath: .status.globalResourceEndpoint, priority: 1 }
        - { name: Scope, type: string, jsonPath: .status.endpointScope, priority: 1 }
        - { name: Enforced-At, type: string, jsonPath: .status.observedEnforcedAt, priority: 1 }

        - { name: Age,      type: date,    jsonPath: .metadata.creationTimestamp }
