# Real credential backing the modaas-llm-auth AgentgatewayPolicy's
# secretRef: agw-apikeys (see agentgatewaypolicy-llm-auth.yaml). This Secret
# was never previously committed to git — it existed only as manual live-cluster
# state on the (now-deleted) modaas-v3 cluster, so a fresh cluster deploy leaves
# modaas-llm-auth in a PartiallyValid state ("secret agentgateway-system/agw-apikeys
# not found") until this is applied. Discovered live 2026-08-28 during Phase B
# conformance testing (LOOP-modaas-live-validation-2026-08-28.md).
#
# Key format per https://agentgateway.dev/docs/kubernetes/latest/security/apikey/
# ("Store keys in a Secret" section): each stringData entry is either a raw key
# string or a JSON object with key/keyHash + optional metadata. Using the raw-key
# form here since this is a workshop/eval credential, not a production secret.
#
# The key name "agw-modaas-eval-key" is the credential already referenced by
# loop/conformance/targets.env for the agentgateway dataplane target — restoring
# it here makes that file's documented value real again.
apiVersion: v1
kind: Secret
metadata:
  name: agw-apikeys
  namespace: agentgateway-system
stringData:
  eval-key: agw-modaas-eval-key
