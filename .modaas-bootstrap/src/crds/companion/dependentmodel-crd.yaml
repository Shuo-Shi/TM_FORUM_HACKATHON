# DependentModel CRD — MODaaS ODA Canvas
# Represents a component-level model dependency. Created by the Component
# Operator, reconciled by the Model Operator. Links a component's K8S
# ServiceAccount to a specific model alias, triggering per-component IRSA
# role creation with Bedrock permissions scoped to the declared model.
#
# Requirements: 2.1, 2.2
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dependentmodels.oda.tmforum.org
  labels:
    app.kubernetes.io/part-of: modaas-canvas
    app.kubernetes.io/managed-by: aws-model-operator
  annotations:
    oda.tmforum.org/crd-version: "v1alpha1"
spec:
  group: oda.tmforum.org
  scope: Namespaced
  names:
    plural: dependentmodels
    singular: dependentmodel
    kind: DependentModel
    shortNames: [dm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["modelAlias", "componentName", "namespace",
                         "k8sServiceAccount"]
              description: "Declares a component's dependency on a model alias"
              properties:
                modelAlias:
                  type: string
                  description: "Model alias to resolve against approved ModelConfig resources"
                componentName:
                  type: string
                  description: "ODA Component name that depends on this model"
                namespace:
                  type: string
                  description: "Namespace where the component is deployed"
                k8sServiceAccount:
                  type: string
                  description: "K8S ServiceAccount to annotate with IRSA role ARN"
            # --- Status (Req 2.2) ---
            status:
              type: object
              description: "Resolved configuration written by the Model Operator after alias resolution and IRSA setup"
              properties:
                endpoint:
                  type: string
                  description: "Bedrock runtime endpoint for the resolved model"
                guardrailId:
                  type: string
                  description: "Bedrock guardrail ID inherited from the resolved ModelConfig"
                iamRoleArn:
                  type: string
                  description: "Per-component IAM Role ARN (canvas-{componentName}-bedrock) for IRSA"
                secretRef:
                  type: string
                  description: "Secrets Manager ARN (canvas/components/{componentName}/models/{alias})"
                ready:
                  type: boolean
                  description: "True when alias resolved, IRSA role created, and SA annotated"
                conditions:
                  type: array
                  description: "Condition array tracking reconciliation progress"
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: "Condition type (e.g., AliasResolved, IRSARoleCreated, ServiceAccountAnnotated)"
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                        description: "Machine-readable reason code (e.g., ModelAliasNotFound)"
                      message:
                        type: string
                        description: "Human-readable message with details"
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Alias
          type: string
          jsonPath: .spec.modelAlias
          description: "Model alias"
        - name: Component
          type: string
          jsonPath: .spec.componentName
          description: "Owning component"
        - name: Ready
          type: boolean
          jsonPath: .status.ready
          description: "Whether IRSA setup is complete"
        - name: Role
          type: string
          jsonPath: .status.iamRoleArn
          description: "Per-component IAM Role ARN"
