    #!/usr/bin/env python3
    # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
    # SPDX-License-Identifier: MIT-0
    """modaas-docs-mcp — the MCP backend behind ToolConfig modaas-docs.

    WHY THIS EXISTS
      Participants need grounded answers about ODA Canvas CRDs, ModelConfig fields,
      Cedar shapes and the DD record without tab-hunting. Module 4 already tells
      them the truth about the alternative: "It doesn't know MoDaaS ... If Q answers
      confidently about a MoDaaS CRD field, treat it as invented."

      The reason it is a ToolConfig rather than a helper script is that it makes the
      platform demonstrate itself. The first tool a participant touches is a GOVERNED
      one: it sits behind /mcp/modaas-docs, it needs the gateway credential, it gets a
      Cedar decision, and it appears in the catalog beside their own assets.
      "Governance is inherited from where you connect" stops being a sentence on a
      page and becomes the thing that just answered their question.

      Deliberately boring, same as demo-tool-backend.py and audit-store.py: stdlib
      only, enough MCP to be a real backend and nothing more. No embeddings, no model
      call, no network egress — retrieval is BM25 over the shipped index, so the KB
      answers while Bedrock is throttled and can never become a spend source.

    TRUTHFULNESS RULE
      Every hit carries source_path and heading_path. A participant can always open
      the file an answer came from, and an answer with no citation is a bug here, not
      a style preference.

    MCP surface (Streamable HTTP, 2024-11-05):
      POST /      initialize | tools/list | tools/call   <- what agentgateway talks to
      POST /mcp   the same handler
      GET  /healthz

      Both POST paths are live on purpose. agentgateway's AgentgatewayBackend
      connects StreamableHTTP to spec.custom.baseUrl's host:port with NO path
      (shared/agentgateway_mcp_backend.py: static.{host,port,protocol}), which is why
      demo-tool-backend.py answers on "/". /mcp is the conventional Streamable HTTP
      path every other MCP client tries first, so serving both removes a 404 nobody
      would diagnose quickly.

    STDIO MODE IS THE UNGOVERNED PATH, AND THAT IS THE LESSON
      `python3 modaas-docs-mcp.py --stdio` speaks MCP on stdin/stdout for local
      development of this server. It is NOT the participant path: a client wired
      straight to stdio or to this pod's ClusterIP gets no credential check, no Cedar
      decision and no ledger record. That is precisely the contrast Module 4 draws —
      the same tool, reached two ways, one of them governed.

    Env:
      INDEX_DIR   directory of *.json.gz shards          (default /kb/index.d)
      INDEX_PATH  a single plain index.json instead      (optional, for --stdio)
    """
    import glob
    import gzip
    import json
    import math
    import os
    import re
    import sys
    from http.server import HTTPServer, BaseHTTPRequestHandler

    INDEX_DIR = os.environ.get("INDEX_DIR", "/kb/index.d")
    INDEX_PATH = os.environ.get("INDEX_PATH", "")
    # 8080 in the cluster, matching the Service and the ToolConfig's baseUrl.
    # Overridable only so the server can be exercised locally on a laptop that
    # already has something on 8080 — which is how this port collision was found.
    PORT = int(os.environ.get("PORT", "8080"))
    PROTOCOL = "2024-11-05"
    SERVER_NAME = "modaas-docs-mcp"
    SERVER_VERSION = "1.0.0"

    MAX_LIMIT = 20
    SNIPPET_CHARS = 600

    K1 = 1.5
    B = 0.75

    _WORD = re.compile(r"[a-z0-9]+")
    _CAMEL = re.compile(r"[A-Z]?[a-z0-9]+|[A-Z]+(?![a-z])")

    # Participants ask questions, not keyword queries ("how do I declare
    # allowedConsumers"). Left in, the question words score: a heading literally
    # named "How do I buy or build an ODA Canvas?" outranked the CRD reference on
    # that exact query during evaluation. Deliberately short — anything that could
    # be a field name or a MoDaaS term stays in.
    STOPWORDS = frozenset("""
    a an and are as at be but by can do does for from get got has have how i if in
    into is it its me my not of on or so that the their them then there these this
    to use used using was what when where which who why will with you your
    """.split())

    TOOLS = [
        {
            "name": "search_docs",
            "description": (
                "Search the ODA Canvas and MoDaaS documentation corpus. Returns ranked "
                "passages, each with the file it came from (source_path) and the heading "
                "path it sat under, so every answer can be traced to a file. Ask in plain "
                "words or with field names, e.g. 'how do I declare allowedConsumers' or "
                "'ToolConfig governance dataClassification enum'."
            ),
            "inputSchema": {
                "type": "object",
                "properties": {
                    "query": {"type": "string", "description": "What you want to know."},
                    "limit": {
                        "type": "integer",
                        "description": "Passages to return, 1-%d (default 5)." % MAX_LIMIT,
                    },
                    "source": {
                        "type": "string",
                        "description": (
                            "Restrict to one corpus: 'ai-canvas', 'modaas', 'oda-canvas' or "
                            "'workshop'. Omit to search all four."
                        ),
                    },
                },
                "required": ["query"],
            },
        },
        {
            "name": "get_doc",
            "description": (
                "Fetch a passage or a whole document verbatim. Pass an id from "
                "search_docs (e.g. 'ai-canvas/decision-log/ADR-004-gateway-mediation-architecture.md#03') for that "
                "passage, or a bare source_path for the entire file reassembled in order."
            ),
            "inputSchema": {
                "type": "object",
                "properties": {
                    "id": {
                        "type": "string",
                        "description": "A chunk id from search_docs, or a source_path.",
                    },
                },
                "required": ["id"],
            },
        },
    ]


    def log(msg):
        """One line per invocation on stdout. `kubectl logs` is the cheapest
        evidence surface this workshop has, and a governed tool whose calls leave no
        trace teaches the wrong thing."""
        sys.stdout.write("%s %s\n" % (SERVER_NAME, msg))
        sys.stdout.flush()


    def tokenize(text):
        """Lowercase word tokens plus camelCase splits.

        `allowedConsumers` has to match a query of "allowed consumers" and vice
        versa, and `spec.governance.dataClassification` has to match any of its
        segments — participants type the field name they half-remember, not the one
        in the schema.
        """
        out = []
        for raw in re.findall(r"[A-Za-z0-9_.\-]+", text):
            for part in _WORD.findall(raw.lower()):
                if len(part) > 1 and part not in STOPWORDS:
                    out.append(part)
            for part in _CAMEL.findall(raw):
                p = part.lower()
                if len(p) > 1 and p not in STOPWORDS:
                    out.append(p)
        return out


    class Index(object):
        """The corpus, plus the BM25 statistics computed once at load."""

        def __init__(self):
            self.chunks = []
            self.by_id = {}
            self.by_source = {}
            self.postings = {}      # term -> {chunk position: term frequency}
            self.lengths = []
            self.avg_len = 0.0
            self.error = ""
            self.sources = {}

        def load(self):
            docs = []
            if INDEX_PATH:
                paths = [INDEX_PATH]
            else:
                paths = sorted(glob.glob(os.path.join(INDEX_DIR, "*.json.gz")))
                paths += sorted(glob.glob(os.path.join(INDEX_DIR, "*.json")))
            if not paths:
                self.error = ("no index found (INDEX_DIR=%s, INDEX_PATH=%s) — the "
                              "ConfigMap shards are not mounted" % (INDEX_DIR, INDEX_PATH or "unset"))
                return self
            for p in paths:
                try:
                    opener = gzip.open if p.endswith(".gz") else open
                    with opener(p, "rt", encoding="utf-8") as f:
                        doc = json.load(f)
                    got = doc.get("chunks") or []
                    docs.extend(got)
                    log("loaded shard %s chunks=%d" % (os.path.basename(p), len(got)))
                except Exception as e:
                    # One unreadable shard must not take the whole KB down; the
                    # others still answer, and the error is visible in /healthz.
                    self.error = "%s unreadable: %s" % (os.path.basename(p), e)
                    log("WARN %s" % self.error)
            if not docs:
                self.error = self.error or "index contained no chunks"
                return self

            docs.sort(key=lambda c: c.get("id", ""))
            self.chunks = docs
            for i, c in enumerate(docs):
                self.by_id[c["id"]] = c
                self.by_source.setdefault(c["source_path"], []).append(c)
                self.sources[c["source_path"].split("/", 1)[0]] = \
                    self.sources.get(c["source_path"].split("/", 1)[0], 0) + 1
                # Heading terms are counted twice: a passage under a heading named
                # for the thing you searched is usually the passage you wanted.
                terms = tokenize(c.get("text", "")) \
                    + tokenize(" ".join(c.get("heading_path") or [])) * 2
                self.lengths.append(len(terms) or 1)
                for t in terms:
                    self.postings.setdefault(t, {})
                    self.postings[t][i] = self.postings[t].get(i, 0) + 1
            self.avg_len = sum(self.lengths) / float(len(self.lengths))
            return self

        def search(self, query, limit, source=None):
            if not self.chunks:
                return []
            q = tokenize(query)
            if not q:
                return []
            n = len(self.chunks)
            scores = {}
            for t in set(q):
                post = self.postings.get(t)
                if not post:
                    continue
                idf = math.log(1.0 + (n - len(post) + 0.5) / (len(post) + 0.5))
                for i, tf in post.items():
                    denom = tf + K1 * (1 - B + B * self.lengths[i] / self.avg_len)
                    scores[i] = scores.get(i, 0.0) + idf * (tf * (K1 + 1)) / denom
            hits = []
            for i, s in scores.items():
                c = self.chunks[i]
                if source and not c["source_path"].startswith(source.rstrip("/") + "/"):
                    continue
                hits.append((s, c))
            # Sort by score, then id: a tie must not reorder between calls.
            hits.sort(key=lambda kv: (-kv[0], kv[1]["id"]))
            return hits[:limit]


    INDEX = Index()


    def _snippet(text):
        if len(text) <= SNIPPET_CHARS:
            return text
        return text[:SNIPPET_CHARS].rsplit("\n", 1)[0].rstrip() + "\n…"


    def _err(msg):
        return {"isError": True, "content": [{"type": "text", "text": msg}]}


    def _ok(payload):
        return {"content": [{"type": "text", "text": json.dumps(payload, indent=2, ensure_ascii=False)}]}


    def do_search(args):
        query = (args or {}).get("query") or ""
        if not query.strip():
            return _err("search_docs requires a non-empty 'query'.")
        try:
            limit = int((args or {}).get("limit") or 5)
        except (TypeError, ValueError):
            return _err("'limit' must be an integer between 1 and %d." % MAX_LIMIT)
        limit = max(1, min(MAX_LIMIT, limit))
        # Availability before validity: with no index loaded, INDEX.sources is empty,
        # so a perfectly valid `source` would be reported as "unknown source ...
        # available: none" — blaming the caller for the operator's missing ConfigMap.
        if not INDEX.chunks:
            return _err("knowledge base unavailable: %s" % (INDEX.error or "empty index"))
        source = (args or {}).get("source") or None
        if source and source not in INDEX.sources:
            return _err("unknown source %r — available: %s"
                        % (source, ", ".join(sorted(INDEX.sources)) or "none"))

        hits = INDEX.search(query, limit, source)
        log("search_docs query=%r source=%s hits=%d" % (query[:120], source or "all", len(hits)))
        if not hits:
            return _ok({
                "query": query,
                "results": [],
                "note": ("No passage matched. Try the field or kind name verbatim "
                         "(ModelConfig, ToolConfig, dataClassification, ExposedAPI)."),
            })
        return _ok({
            "query": query,
            "results": [{
                "id": c["id"],
                "source_path": c["source_path"],
                "heading_path": c.get("heading_path") or [],
                "score": round(s, 4),
                "text": _snippet(c["text"]),
            } for s, c in hits],
            "citation_rule": ("Cite source_path (and heading_path) for every claim; "
                              "call get_doc with an id for the full passage."),
        })


    def do_get(args):
        ident = ((args or {}).get("id") or "").strip()
        if not ident:
            return _err("get_doc requires 'id' — a chunk id from search_docs or a source_path.")
        if not INDEX.chunks:
            return _err("knowledge base unavailable: %s" % (INDEX.error or "empty index"))

        chunk = INDEX.by_id.get(ident)
        if chunk:
            log("get_doc id=%s" % ident)
            return _ok({
                "id": chunk["id"],
                "source_path": chunk["source_path"],
                "heading_path": chunk.get("heading_path") or [],
                "text": chunk["text"],
            })

        parts = INDEX.by_source.get(ident)
        if parts:
            log("get_doc source_path=%s chunks=%d" % (ident, len(parts)))
            ordered = sorted(parts, key=lambda c: c["id"])
            return _ok({
                "source_path": ident,
                "heading_path": [],
                "chunk_ids": [c["id"] for c in ordered],
                "text": "\n\n".join(c["text"] for c in ordered),
            })

        near = [s for s in INDEX.by_source if ident.lower() in s.lower()][:5]
        return _err("no such id or source_path: %r%s"
                    % (ident, ("  did you mean: " + ", ".join(near)) if near else ""))


    def call_tool(name, args):
        if name == "search_docs":
            return do_search(args)
        if name == "get_doc":
            return do_get(args)
        return _err("unknown tool %s" % name)


    def handle(req):
        """One JSON-RPC request -> one response dict, or None for a notification."""
        rid, method = req.get("id"), req.get("method")
        if method == "initialize":
            res = {"protocolVersion": PROTOCOL,
                   "capabilities": {"tools": {}},
                   "serverInfo": {"name": SERVER_NAME, "version": SERVER_VERSION}}
        elif method == "tools/list":
            res = {"tools": TOOLS}
        elif method == "tools/call":
            p = req.get("params") or {}
            res = call_tool(p.get("name"), p.get("arguments"))
        elif method == "ping":
            res = {}
        elif rid is None or str(method or "").startswith("notifications/"):
            # A notification has no response. Answering one with {"id": null}
            # is not valid JSON-RPC, and agentgateway rejects it with a 500,
            # which broke every real MCP client (found 2026-09-29).
            return None
        else:
            return {"jsonrpc": "2.0", "id": rid,
                    "error": {"code": -32601, "message": "method not found: %s" % method}}
        return {"jsonrpc": "2.0", "id": rid, "result": res}


    class H(BaseHTTPRequestHandler):
        def log_message(self, *a):
            pass    # the access log is noise; tool calls are logged by log()

        def _json(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b)))
            # Streamable HTTP clients expect a session id on initialize; a fixed one
            # is fine for a single-tenant, read-only backend.
            self.send_header("Mcp-Session-Id", SERVER_NAME)
            self.end_headers()
            self.wfile.write(b)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                # 503 when the index did not load, so the readinessProbe actually
                # gates it. A 200 with "ok": false would let a pod with no corpus go
                # Ready and answer every question with an error — the ToolConfig
                # would reach Approved, publish /mcp/modaas-docs, and be useless.
                # That is the "Approved does not mean reachable" failure this
                # workshop already documents for demo-crm-lookup; no need for a
                # second instance of it.
                ok = bool(INDEX.chunks)
                return self._json(200 if ok else 503, {
                    "ok": ok,
                    "chunks": len(INDEX.chunks),
                    "sources": INDEX.sources,
                    "error": INDEX.error,
                })
            return self._json(404, {"error": "not found"})

        def do_POST(self):
            if self.path.rstrip("/") not in ("", "/mcp"):
                return self._json(404, {"error": "not found: %s" % self.path})
            try:
                n = int(self.headers.get("Content-Length", 0))
                req = json.loads(self.rfile.read(n))
            except Exception as e:
                return self._json(400, {"jsonrpc": "2.0", "id": None,
                                        "error": {"code": -32700, "message": str(e)}})
            out = handle(req)
            if out is None:
                # Streamable HTTP: a notification is accepted with no body.
                self.send_response(202)
                self.send_header("Content-Length", "0")
                self.send_header("Mcp-Session-Id", SERVER_NAME)
                self.end_headers()
                return
            self._json(200, out)


    def serve_stdio():
        """Line-delimited JSON-RPC on stdin/stdout. See the module docstring: this
        path is ungoverned by construction and is not the participant path."""
        for line in sys.stdin:
            line = line.strip()
            if not line:
                continue
            try:
                req = json.loads(line)
            except Exception as e:
                out = {"jsonrpc": "2.0", "id": None,
                       "error": {"code": -32700, "message": str(e)}}
            else:
                out = handle(req)
            if out is not None:
                # stdout carries only JSON-RPC here; log() is rebound to stderr below.
                sys.stdout.write(json.dumps(out) + "\n")
                sys.stdout.flush()


    if __name__ == "__main__":
        stdio = "--stdio" in sys.argv[1:]
        if stdio:
            # log() must not corrupt the JSON-RPC stream on stdout.
            log = lambda msg: sys.stderr.write("%s %s\n" % (SERVER_NAME, msg))
        INDEX.load()
        if INDEX.error:
            log("WARN %s" % INDEX.error)
        log("ready chunks=%d sources=%s" % (len(INDEX.chunks), sorted(INDEX.sources)))
        if stdio:
            serve_stdio()
        else:
            log("listening on 0.0.0.0:%d" % PORT)
            HTTPServer(("0.0.0.0", PORT), H).serve_forever()
